name: Myron 6.12.118 KernelSU Next AK3
run-name: Myron b5ed8bcc + KernelSU Next v3.4.2 / AnyKernel3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myron-ksunext-ak3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ARCH: arm64
      LLVM: '1'
      LLVM_IAS: '1'
      KBUILD_BUILD_USER: build-user
      KBUILD_BUILD_HOST: build-host
      KERNEL_COMMIT: b5ed8bcc4a5ada8b27ad28373fb8dbe060a25a2e
      KSU_COMMIT: 4c706b5938665866ebe16944a481a7b91e3396af
      AK3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
    steps:
      - name: Checkout cloud build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout the currently booting Myron source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuwenhua653/android_kernel_xiaomi_sm8850
          ref: b5ed8bcc4a5ada8b27ad28373fb8dbe060a25a2e
          path: kernel/xiaomi/sm8850
          persist-credentials: false
      - name: Checkout module headers used by the kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuwenhua653/android_kernel_xiaomi_sm8850-modules
          ref: 5638362f5eeb3cc0c8bbcd7d9cbf456e0fd9cc74
          path: kernel/xiaomi/sm8850-modules
          persist-credentials: false
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex \
            libssl-dev libelf-dev libdw-dev zlib1g-dev dwarves cpio rsync zip unzip xz-utils cmake pkg-config
          mkdir -p toolchains/clang toolchains/rust toolchains/bin out dist logs
      - name: Checkout pahole 1.25 for the upstream per-CPU fix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acmel/dwarves
          ref: 81558a5a996005df0d607dd33f74ec5b7bdb619d
          path: toolchains/pahole-src
          submodules: recursive
          persist-credentials: false
      - name: Backport and verify the upstream pahole capacity fix
        run: |
          set -euo pipefail
          # Preserve v1.25's BTF features and CONFIG_PAHOLE_VERSION=125.
          # Replace the fixed 4096-entry array with upstream dynamic allocation.
          git -C toolchains/pahole-src fetch --depth=2 origin f32ec0c79f3e8065e5b0e4aced65cba4cdf6675b
          git -C toolchains/pahole-src show --format= f32ec0c79f3e8065e5b0e4aced65cba4cdf6675b > logs/pahole-percpu.patch
          git -C toolchains/pahole-src apply --check "$GITHUB_WORKSPACE/logs/pahole-percpu.patch"
          git -C toolchains/pahole-src apply "$GITHUB_WORKSPACE/logs/pahole-percpu.patch"
          cmake -S toolchains/pahole-src -B toolchains/pahole-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build toolchains/pahole-build --target pahole -j4
          test "$(toolchains/pahole-build/pahole --version)" = v1.25
          python3 - <<'PYPERCPU'
          from pathlib import Path
          Path('logs/percpu-probe.c').write_text(''.join(
              f'int percpu_probe_{i} __attribute__((section(".data..percpu"))) = {i};\n'
              for i in range(5000)))
          PYPERCPU
          gcc -g -O0 -c logs/percpu-probe.c -o logs/percpu-probe.o
          # Ubuntu's build may report this failure with exit status zero.
          /usr/bin/pahole -J --btf_encode_detached=logs/percpu-original.btf logs/percpu-probe.o > logs/pahole-original-probe.log 2>&1 || true
          grep -Fq 'Reached the limit of per-CPU variables: 4096' logs/pahole-original-probe.log
          test ! -s logs/percpu-original.btf
          toolchains/pahole-build/pahole -J --btf_encode_detached=logs/percpu-fixed.btf logs/percpu-probe.o
          test -s logs/percpu-fixed.btf
          python3 - <<'PYBTF'
          import struct
          from pathlib import Path
          data = Path('logs/percpu-fixed.btf').read_bytes()
          magic, version, flags, hdr, off, size, strings, strings_size = struct.unpack_from('<HBBIIIII', data)
          assert (magic, version) == (0xeb9f, 1)
          pos, end, variables = hdr + off, hdr + off + size, 0
          fixed = {1: 4, 2: 0, 3: 12, 7: 0, 8: 0, 9: 0, 10: 0, 11: 0,
                   12: 0, 14: 4, 16: 0, 17: 4, 18: 0}
          variable = {4: 12, 5: 12, 6: 8, 13: 8, 15: 12, 19: 12}
          while pos < end:
              name, info, type_size = struct.unpack_from('<III', data, pos)
              kind, count = (info >> 24) & 31, info & 0xffff
              assert kind in fixed or kind in variable, f'Unknown BTF kind {kind}'
              variables += kind == 14
              pos += 12 + (fixed[kind] if kind in fixed else variable[kind] * count)
          assert pos == end and variables == 5000, (pos, end, variables)
          PYBTF
          echo 'PASS: upstream fix encodes 5000 per-CPU variables with pahole v1.25' | tee logs/pahole-percpu-check.txt
          echo "$GITHUB_WORKSPACE/toolchains/pahole-build" >> "$GITHUB_PATH"
      - name: Restore pinned toolchains
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            toolchains/clang
            toolchains/rust
            toolchains/bindgen
          key: myron-android-clang-531a564-rust-dd9de2c-bindgen-0.72.0-v1
      - name: Download the matching Android toolchains
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 5 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/531a564ba5426707dee226eccb19f104a7af5a5f/clang-r563880c.tar.gz' \
            -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C toolchains/clang
          curl -fL --retry 5 \
            'https://android.googlesource.com/platform/prebuilts/rust-toolchain/linux-x86/+archive/dd9de2cd33ba15d2e41346fd210d5937440196ed/1.93.1.tar.gz' \
            -o "$RUNNER_TEMP/rust.tar.gz"
          tar -xzf "$RUNNER_TEMP/rust.tar.gz" -C toolchains/rust
          CARGO_BUILD_JOBS=2 cargo install bindgen-cli --version 0.72.0 --locked --root "$GITHUB_WORKSPACE/toolchains/bindgen"
          sha256sum "$RUNNER_TEMP/clang.tar.gz" "$RUNNER_TEMP/rust.tar.gz" toolchains/bindgen/bin/bindgen > logs/toolchains.sha256
          rm "$RUNNER_TEMP/clang.tar.gz" "$RUNNER_TEMP/rust.tar.gz"
      - name: Save pinned toolchains
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            toolchains/clang
            toolchains/rust
            toolchains/bindgen
          key: myron-android-clang-531a564-rust-dd9de2c-bindgen-0.72.0-v1
      - name: Select pinned toolchains
        run: |
          printf '%s\n' "$GITHUB_WORKSPACE/toolchains/clang/bin" "$GITHUB_WORKSPACE/toolchains/rust/bin" "$GITHUB_WORKSPACE/toolchains/bindgen/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$GITHUB_WORKSPACE/toolchains/clang/lib" >> "$GITHUB_ENV"
      - name: Verify toolchain and preserve the captured configuration
        run: |
          set -euo pipefail
          clang --version | tee logs/clang.txt
          rustc --version --verbose | tee logs/rust.txt
          bindgen --version | tee logs/bindgen.txt
          pahole --version | tee logs/pahole.txt
          grep -Fq 'r563880c' logs/clang.txt
          grep -Fq '14054515' logs/clang.txt
          grep -Fq '1.93.1' logs/rust.txt
          grep -Fq '14933020' logs/rust.txt
          grep -Fxq 'bindgen 0.72.0' logs/bindgen.txt
          test -f "$(rustc --print sysroot)/lib/rustlib/src/rust/library/core/src/lib.rs"
          cp .github/myron-ksunext/known-good.config out/.config
          make -C kernel/xiaomi/sm8850 O="$GITHUB_WORKSPACE/out" olddefconfig
          kernel/xiaomi/sm8850/scripts/diffconfig .github/myron-ksunext/known-good.config out/.config | tee logs/baseline-config.diff
          # Same Rust release text, but the captured config contains LLVM 21
          # metadata whereas the pinned official binary reports LLVM 22.0.1.
          # Only allow these exact detected differences. RUST_INLINE_HELPERS
          # stays disabled and the original config already has LTO_NONE=y.
          python3 - <<'PYCONFIG'
          from pathlib import Path
          allowed = {
              '-RUSTC_CLANG_LLVM_COMPATIBLE y',
              '-RUST_INLINE_HELPERS n',
              ' RUSTC_LLVM_MAJOR_VERSION 21 -> 22',
              ' RUSTC_LLVM_VERSION 210108 -> 220001',
          }
          actual = set(Path('logs/baseline-config.diff').read_text().splitlines())
          assert actual <= allowed, f'Unexpected config drift: {actual - allowed}'
          config = Path('out/.config').read_text()
          assert 'CONFIG_LTO_NONE=y\n' in config
          assert 'CONFIG_RUST_INLINE_HELPERS=y\n' not in config
          PYCONFIG
          make -s -C kernel/xiaomi/sm8850 O="$GITHUB_WORKSPACE/out" kernelrelease > logs/kernelrelease.txt
          grep -Fxq '6.12.118-gb5ed8bcc4a5a-yuzuli' logs/kernelrelease.txt
      - name: Build the baseline exported symbol versions
        run: |
          set -euo pipefail
          make -C kernel/xiaomi/sm8850 O="$GITHUB_WORKSPACE/out" -j4 Image 2>&1 | tee logs/baseline-build.log
          test -s out/vmlinux.symvers
          cp out/vmlinux.symvers logs/baseline.symvers
          cp out/.config logs/baseline.config
      - name: Integrate official KernelSU Next with its setup script
        run: |
          set -euo pipefail
          cd kernel/xiaomi/sm8850
          curl -fL --retry 3 "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/$KSU_COMMIT/kernel/setup.sh" -o "$RUNNER_TEMP/ksunext-setup.sh"
          sh "$RUNNER_TEMP/ksunext-setup.sh" "$KSU_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          test "$(git -C KernelSU-Next describe --tags --exact-match)" = v3.4.2
          scripts/config --file "$GITHUB_WORKSPACE/out/.config" --enable KSU --disable KSU_DEBUG --disable KSU_DISABLE_MANAGER --disable KSU_DISABLE_POLICY
          make O="$GITHUB_WORKSPACE/out" olddefconfig
          grep -Fxq 'CONFIG_KSU=y' "$GITHUB_WORKSPACE/out/.config"
          scripts/diffconfig "$GITHUB_WORKSPACE/logs/baseline.config" "$GITHUB_WORKSPACE/out/.config" | tee "$GITHUB_WORKSPACE/logs/ksunext-config.diff"
          if grep -Ev '^\+?KSU(_[A-Z0-9_]+)? ' "$GITHUB_WORKSPACE/logs/ksunext-config.diff"; then
            echo '::error::Unexpected configuration change outside KernelSU'; exit 1
          fi
      - name: Build the rooted kernel with standard Kbuild
        run: |
          set -euo pipefail
          make -C kernel/xiaomi/sm8850 O="$GITHUB_WORKSPACE/out" -j4 Image 2>&1 | tee logs/ksunext-build.log
          grep -Fq 'KernelSU-Next tag: v3.4.2' logs/ksunext-build.log
          llvm-nm out/vmlinux | grep -w kernelsu_init > logs/ksunext-symbol.txt
          make -s -C kernel/xiaomi/sm8850 O="$GITHUB_WORKSPACE/out" kernelrelease > logs/root-kernelrelease.txt
          cmp logs/kernelrelease.txt logs/root-kernelrelease.txt
          cp out/.config logs/root.config
          cp out/vmlinux.symvers logs/root.symvers
      - name: Verify existing exported symbol CRCs are unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              return {f[1]: f[0] for line in Path(path).read_text().splitlines() if (f := line.split())}
          old, new = read('logs/baseline.symvers'), read('logs/root.symvers')
          assert old, 'No baseline exported symbols'
          changed = [name for name, crc in old.items() if new.get(name) != crc]
          Path('logs/exported-crc-check.txt').write_text(f'Compared {len(old)} baseline exports; changed/missing: {len(changed)}\n' + '\n'.join(changed))
          assert not changed, 'KernelSU changes existing exported CRCs; do not package for existing DLKM'
          PY
      - name: Checkout standard AnyKernel3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: osm0sis/AnyKernel3
          ref: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          path: AnyKernel3
          persist-credentials: false
      - name: Package with the documented AnyKernel3 layout
        run: |
          set -euo pipefail
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cp .github/myron-ksunext/anykernel.sh AnyKernel3/anykernel.sh
          bash -n AnyKernel3/anykernel.sh
          {
            echo "KERNEL=$KERNEL_COMMIT"
            echo "KERNELSU_NEXT=$KSU_COMMIT (v3.4.2)"
            echo "ANYKERNEL3=$AK3_COMMIT"
            echo "WORKFLOW=$GITHUB_SHA"
            echo 'Target: myron, current 6.12.118 b5ed8bcc Evolution build'
            echo 'Payload: Image only; existing vendor_boot/DTBO/DLKM retained'
          } > AnyKernel3/build-info.txt
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/dist/AnyKernel3-myron-6.12.118-KSU-Next-v3.4.2-yuzuli.zip" * -x 'README.md' '*placeholder' > "$GITHUB_WORKSPACE/logs/zip.log"
          cd "$GITHUB_WORKSPACE/dist"
          unzip -t AnyKernel3-*.zip > "$GITHUB_WORKSPACE/logs/zip-check.txt"
          sha256sum AnyKernel3-*.zip > SHA256SUMS
          test -s ../AnyKernel3/LICENSE
          echo 'Standard AK3 ZIP built; boot/charging/root still require device validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Recovery flashable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ksunext-ak3-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ksunext-logs-${{ github.run_id }}
          path: logs/*
          if-no-files-found: warn
          retention-days: 14
