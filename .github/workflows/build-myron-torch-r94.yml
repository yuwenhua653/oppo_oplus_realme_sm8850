name: Myron R94 PMH0101 MCA torch compatibility

on:
  push:
    branches:
      - codex/myron-r61-battery
    paths:
      - .github/workflows/build-myron-torch-r94.yml
      - r94-build-route/**
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs
        type: choice
        required: true
        default: '2'
        options: ['2', '4']

permissions:
  contents: read

concurrency:
  group: myron-r94-torch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_NODEBUG: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      WORKSPACE_DIR: ${{ github.workspace }}/kernel_workspace/myron-platform-r1
      PACKAGE_DIR: ${{ github.workspace }}/myron-qcom-platform-r1
      BUILD_JOBS: ${{ inputs.jobs || '2' }}
    steps:
      - name: Checkout integration files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify frozen R94 patch and R92 preparation before sync
        shell: bash
        run: |
          set -euo pipefail
          echo '603236aa073d05d006ab5494563cfc745a23809b87a3a2dc66f6680766a32da8  r94-build-route/INPUTS.json' | sha256sum --check --strict
          python3 -B r94-build-route/check_inputs.py
          python3 -B r94-build-route/build_led.py --repo-root "$GITHUB_WORKSPACE" --check-inputs
          mkdir -p "$GITHUB_WORKSPACE/r94-host-reports"
          python3 -B r94-build-route/test_route_guards.py > "$GITHUB_WORKSPACE/r94-host-reports/route-guards.log" 2>&1
          python3 -B r94-build-route/tests/run_tests.py --source r94-build-route/payload/leds-qcom-flash.c --out "$GITHUB_WORKSPACE/r94-host-reports/led"

      - name: Extract unchanged pinned source preparation bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 r55-source/ci/extract_inputs.py --root "$GITHUB_WORKSPACE"
          python3 "$GITHUB_WORKSPACE/myron-adaptation-r12/fastcheck_r12.py" --reports "$GITHUB_WORKSPACE/myron-fastchecks"

      - name: Prepare hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zstd lz4 rsync zip unzip cpio pkg-config patch
          df -h .
          free -h

      - name: Sync locked source and toolchain revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 r61-build-route/sync_with_retry.py --package "$PACKAGE_DIR" --workspace "$WORKSPACE_DIR" --jobs 4

      - name: Apply unchanged R18 preparation hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 r55-source/ci/prepare_legacy.py

      - name: Build one inactive LED candidate with R92 configuration
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DEBUG
          python3 -B r94-build-route/check_inputs.py
          python3 -B r94-build-route/build_led.py --workspace "$WORKSPACE_DIR" --package "$PACKAGE_DIR" --baseline "$GITHUB_WORKSPACE/myron-adaptation-r12" --r18 "$GITHUB_WORKSPACE/myron-boot-r18" --repo-root "$GITHUB_WORKSPACE" --jobs "$BUILD_JOBS"

      - name: Upload R94 source and diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r94-torch-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORKSPACE_DIR }}/integration-reports/
            ${{ env.PACKAGE_DIR }}/sources.lock.json
            ${{ github.workspace }}/r94-host-reports/
            ${{ github.workspace }}/r94-build-route/
            ${{ github.workspace }}/.github/workflows/build-myron-torch-r94.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload single LED compile candidate
        if: ${{ !cancelled() && hashFiles('kernel_workspace/myron-platform-r1/integration-artifacts/r94-led-candidate/candidate-status.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r94-led-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORKSPACE_DIR }}/integration-artifacts/r94-led-candidate/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
