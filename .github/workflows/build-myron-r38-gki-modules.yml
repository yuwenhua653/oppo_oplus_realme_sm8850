                successful[name] = generated
                result.update(status="BUILD_AND_STATIC_AUDIT_PASS", sha256=digest(candidate_path), bytes=candidate_path.stat().st_size)
            except Exception as error:
                statuses = {"source": "SOURCE_OR_PROVIDER_FAILED", "build": "BUILD_FAILED", "audit": "AUDIT_FAILED"}
                result.update(status=statuses.get(result["stage"], "FAILED"), errors=[type(error).__name__ + ": " + str(error)])
            finally:
                result["elapsed_seconds"] = round(time.monotonic() - started, 2)
                write_json(output / "status.json", result)
                checksums(output)
            return result


        def main(argv=None):
            parser = argparse.ArgumentParser(description=__doc__)
            for arg in ("manifest", "work-root", "output", "kernel-source", "kernel-out", "elf-helper"):
                parser.add_argument("--" + arg, type=Path, required=True)
            parser.add_argument("--release", required=True)
            parser.add_argument("--jobs", type=int, default=2)
            parser.add_argument("--build-timeout", type=int, default=900)
            parser.add_argument("--download-timeout", type=int, default=180)
            args = parser.parse_args(argv)
            for field in ("manifest", "work_root", "output", "kernel_source", "kernel_out", "elf_helper"):
                setattr(args, field, getattr(args, field).resolve())
            args.output.mkdir(parents=True, exist_ok=True)
            report = {"schema_version": 1, "release": args.release, "limitations": LIMITATION, "modules": [], "errors": []}
            try:
                require(args.jobs > 0 and args.build_timeout > 0 and args.download_timeout > 0, "Invalid parallelism/timeout")
                manifest = json.loads(args.manifest.read_text())
                validate_manifest(manifest)
                entries = list(ordered_modules(manifest["modules"]))
                write_json(args.output / "manifest.json", manifest)
                helper = load_helper(args.elf_helper)
                core_path = args.kernel_out / "Module.symvers"
                core = read_symvers(core_path)
                require(core, "Full kernel Module.symvers is empty")
                require((args.kernel_out / "scripts/module.lds").is_file(), "Kernel modules build/preparation is incomplete")
                report["kernel_module_symvers_sha256"] = digest(core_path)
                report["manifest_sha256"] = digest(args.manifest)
                successful = {}
                baseline = kernel_hashes(args.kernel_out)
                report["kernel_baseline_sha256"] = baseline
                for entry in entries:
                    before = kernel_hashes(args.kernel_out)
                    require(before == baseline, "Kernel baseline changed before " + entry["name"] + "; stopping remaining modules")
                    result = build_one(entry, manifest, args, helper, core, successful)
                    report["modules"].append(result)
                    result["kernel_before_sha256"] = before
                    try:
                        after = kernel_hashes(args.kernel_out)
                    except Exception as error:
                        result["previous_status"] = result["status"]
                        result["status"] = "KERNEL_BASELINE_CHECK_FAILED"
                        result["errors"].append("Cannot verify kernel baseline after build: " + str(error))
                        write_json(args.output / entry["name"] / "status.json", result)
                        checksums(args.output / entry["name"])
                        raise TrialError(result["errors"][-1])
                    result["kernel_after_sha256"] = after
                    if after != baseline:
                        result["previous_status"] = result["status"]
                        result["status"] = "KERNEL_BASELINE_CHANGED"
                        result["errors"].append("Kernel Image/config/symvers changed; stopping remaining modules")
                        write_json(args.output / entry["name"] / "status.json", result)
                        checksums(args.output / entry["name"])
                        raise TrialError(result["errors"][-1])
                    write_json(args.output / entry["name"] / "status.json", result)
                    checksums(args.output / entry["name"])
                    write_json(args.output / "summary.json", report)
                    print(result["name"] + ": " + result["status"], flush=True)
            except Exception as error:
                report["errors"].append(type(error).__name__ + ": " + str(error))
            report["passed"] = sum(row["status"] == "BUILD_AND_STATIC_AUDIT_PASS" for row in report["modules"])
            report["failed_or_blocked"] = len(report["modules"]) - report["passed"]
            report["status"] = "FAIL" if report["errors"] or report["failed_or_blocked"] else "PASS"
            attempted = {row["name"] for row in report["modules"]}
            report["not_attempted"] = [entry["name"] for entry in locals().get("entries", []) if entry["name"] not in attempted]
            write_json(args.output / "summary.json", report)
            rows = ["# Pinned Xiaomi module batch", "", LIMITATION, "", "| Module | Result | Details | Source review notes | Source fixes |", "|---|---|---|---|---|"]
            for row in report["modules"]:
                detail = "; ".join(row["errors"]).replace("|", "\\|").replace("\n", " ")
                notes = "; ".join(row["source_review_notes"]).replace("|", "\\|").replace("\n", " ")
                fixes = "; ".join(fix["path"] + " (" + fix["status"] + "): " + fix["reason"] for fix in row.get("source_fixes", []))
                fixes = fixes.replace("|", "\\|").replace("\n", " ")
                rows.append("| %s | %s | %s | %s | %s |" % (row["name"], row["status"], detail, notes, fixes))
            if report["not_attempted"]:
                rows.extend(["", "Not attempted after a batch setup/baseline failure: " + ", ".join(report["not_attempted"])])
            if report["errors"]:
                rows.extend(["", "Batch setup errors:"] + ["- " + error for error in report["errors"]])
            rows.extend(["", "Passed: %d; failed or blocked: %d." % (report["passed"], report["failed_or_blocked"])])
            (args.output / "summary.md").write_text("\n".join(rows) + "\n")
            checksums(args.output)
            return 0 if report["status"] == "PASS" else 1


        if __name__ == "__main__":
            sys.exit(main())
