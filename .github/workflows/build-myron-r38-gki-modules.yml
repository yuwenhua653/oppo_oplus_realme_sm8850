# Standalone: one pinned r38 Image/GKI build + mi_fp + five source-backed vendor trials.
# No automatic vendor installation; no flashable system_dlkm/vendor_dlkm image.
# The previously successful mi_fp workflow is preserved separately.
name: Myron r38 GKI + 6 vendor trials (source fixes r2)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  TZ: Asia/Shanghai
  ACK_TAG: android16-6.12-2025-09_r38
  ACK_COMMIT: 98d5b9e071f1828ec75981d3758cc20c452616a3
  EXPECTED_VERSION: 6.12.38
  TOOLCHAIN_RELEASE: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225
  KSU_TYPE: ksunext
  SUSFS_ENABLE: 'false'
  KPM_ENABLE: 'false'
  LZ4_ENABLE: 'false'
  BBR_ENABLE: 'false'
  BETTER_NET: 'false'
  BASEBAND_GUARD: 'false'
  KERNEL_SUFFIX: ''
  WORKFLOW_CCACHE_DEBUG: 'false'
  KSU_COMMIT: 4c5853188012f63a1a1fedd4a57fda6375fecb38
  KSU_VERSION_BASE: 2b31f7185460e99bc3896a639e9073b1c354ee0d
  MI_SOURCE_COMMIT: 45705be1220b4cfa8100516ad86711656c0b634e
  STOCK_COMMIT: 9999f765b53876bf7a013a4fde5221153ad570fc
  BASE_CONFIG_SHA256: 75fd08bd3615b708efab4433881a604b7d696b98190f15b85e22d34893f1c7e4
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
    - name: 检查输入及安装依赖
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/00-step.log") 2>&1
        set -euo pipefail
        if [[ ! "$KERNEL_SUFFIX" =~ ^[a-zA-Z0-9._-]{0,16}$ ]]; then
          echo '::error::kernel_suffix 只能包含字母、数字、点、下划线、连字符，最多 16 字符'
          exit 1
        fi
        if [[ "$SUSFS_ENABLE" == true && "$KSU_TYPE" == none ]]; then
          echo '::error::SUSFS 需要选择 KernelSU 分支'
          exit 1
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison flex gawk build-essential binutils git curl ca-certificates \
          python3 python-is-python3 libssl-dev libelf-dev libdw-dev \
          zlib1g-dev libzstd-dev dwarves zstd zip unzip xz-utils ccache rsync kmod openssl
        mkdir -p "$GITHUB_WORKSPACE/kernel_workspace" "$GITHUB_WORKSPACE/dist"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache-r38" >> "$GITHUB_ENV"
        echo 'CCACHE_MAXSIZE=3G' >> "$GITHUB_ENV"
        echo 'CCACHE_COMPILERCHECK=content' >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE/kernel_workspace" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/dist/mi_fp-diagnostic" "$GITHUB_WORKSPACE/dist/gki-modules"
    - name: 获取并核验官方 ACK tag
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/01-step.log") 2>&1
        set -euo pipefail
        cd kernel_workspace
        git init common
        git -C common remote add origin https://android.googlesource.com/kernel/common
        git -C common fetch --depth=1 origin "refs/tags/$ACK_TAG:refs/tags/$ACK_TAG"
        git -C common checkout --detach "refs/tags/$ACK_TAG"
        actual_commit=$(git -C common rev-parse HEAD)
        [[ "$actual_commit" == "$ACK_COMMIT" ]] || { echo '::error::ACK tag 的提交与预期不同'; exit 1; }
        actual_version=$(make -s -C common kernelversion)
        [[ "$actual_version" == "$EXPECTED_VERSION" ]] || { echo "::error::源码版本错误：$actual_version"; exit 1; }
        grep -qx 'BRANCH=android16-6.12' common/build.config.constants
        grep -qx 'KMI_GENERATION=5' common/build.config.constants
        grep -qx 'CLANG_VERSION=r536225' common/build.config.constants
        grep -qx 'RUSTC_VERSION=1.82.0' common/build.config.constants
        {
          echo "ACK_TAG=$ACK_TAG"
          echo "ACK_COMMIT=$actual_commit"
          echo "KERNEL_VERSION=$actual_version"
          echo 'KMI_GENERATION=5'
          echo "WORKFLOW_REPOSITORY=$GITHUB_REPOSITORY"
          echo "WORKFLOW_COMMIT=$GITHUB_SHA"
          echo "RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "KSU_TYPE=$KSU_TYPE SUSFS=$SUSFS_ENABLE KPM=$KPM_ENABLE"
          echo "LZ4_ZSTD=$LZ4_ENABLE BBR=$BBR_ENABLE IPSET=$BETTER_NET BBG=$BASEBAND_GUARD"
        } > "$GITHUB_WORKSPACE/dist/build-info.txt"
    - name: 获取 Clang 19、Rust 1.82 和构建工具
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/02-step.log") 2>&1
        set -euo pipefail
        cd kernel_workspace
        # 沿用原作者工具链镜像。校验版本，并记录每次下载的 SHA256。
        curl -fL --retry 5 "$TOOLCHAIN_RELEASE/clang-r536225.zip" -o clang.zip
        curl -fL --retry 5 "$TOOLCHAIN_RELEASE/rust.zip" -o rust.zip
        curl -fL --retry 5 "$TOOLCHAIN_RELEASE/build-tools.zip" -o build-tools.zip
        sha256sum clang.zip rust.zip build-tools.zip >> "$GITHUB_WORKSPACE/dist/build-info.txt"
        # SHA256 来自已开机的 Actions run 36854083282；镜像变化时停止。
        cat > toolchains.sha256 <<'HASHES'
        574ef505fa9222c24bb75a9c6592fd62ca546bd86267f73b5533ec38a239f0ea  clang.zip
        4adf5f226cd4ac4840f454955b52b07e99a198a859efe635194e89e7c35c3f41  rust.zip
        821babb745321981222d0cb42af5c1214e4efc908b159ae82dbd8113d978c7dd  build-tools.zip
        HASHES
        sha256sum --check toolchains.sha256
        unzip -q clang.zip -d clang19
        unzip -q rust.zip -d rust
        unzip -q build-tools.zip
        rm clang.zip rust.zip build-tools.zip
        tool_root="$GITHUB_WORKSPACE/kernel_workspace"
        export PATH="$tool_root/clang19/bin:$tool_root/build-tools/bin:$tool_root/rust/bin:$PATH"
        export LIBCLANG_PATH="$tool_root/clang19/lib"
        clang --version | tee "$GITHUB_WORKSPACE/dist/clang-version.txt"
        grep -q 'r536225' "$GITHUB_WORKSPACE/dist/clang-version.txt"
        rustc --version | tee "$GITHUB_WORKSPACE/dist/rust-version.txt"
        grep -Eq '^rustc 1\.82\.0([ -]|$)' "$GITHUB_WORKSPACE/dist/rust-version.txt"
        bindgen --version
        pahole --version
        test -f "$(rustc --print sysroot)/lib/rustlib/src/rust/library/core/src/lib.rs"
        printf '%s\n' "$tool_root/clang19/bin" "$tool_root/build-tools/bin" "$tool_root/rust/bin" >> "$GITHUB_PATH"
        echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
        {
          clang --version
          rustc --version
          bindgen --version
          pahole --version
        } >> "$GITHUB_WORKSPACE/dist/build-info.txt"
    - name: 恢复独立的 r38 编译缓存
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: myron-r38-gki-modules-4c585318-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          myron-r38-gki-modules-4c585318-v1-${{ runner.os }}-
          myron-mi-fp-r38-4c585318-v1-${{ runner.os }}-
    - name: 准备构建环境及补丁检查函数
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/04-step.log") 2>&1
        set -euo pipefail
        cat > kernel_workspace/build-env.sh <<'ENV'
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang19/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/bin:$GITHUB_WORKSPACE/kernel_workspace/rust/bin:$PATH"
        export ARCH=arm64 LLVM=1 LLVM_IAS=1
        export RUSTC=rustc BINDGEN=bindgen
        export KBUILD_GENDWARFKSYMS_STABLE=1
        export KBUILD_BUILD_USER=build-user KBUILD_BUILD_HOST=build-host KBUILD_BUILD_VERSION=1
        export SOURCE_DATE_EPOCH
        SOURCE_DATE_EPOCH=$(git -C "$GITHUB_WORKSPACE/kernel_workspace/common" show -s --format=%ct HEAD)
        export KBUILD_BUILD_TIMESTAMP
        KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$SOURCE_DATE_EPOCH" '+%a %b %d %T UTC %Y')
        export LOCALVERSION="-android16-5-g98d5b9e071f1${KERNEL_SUFFIX:+-$KERNEL_SUFFIX}-4k"
        # 与直接 make 流程配套，避免 DWARF 里携带 runner 的工作目录。
        export KCFLAGS="-D__ANDROID_COMMON_KERNEL__ -fdebug-prefix-map=$GITHUB_WORKSPACE/kernel_workspace=. -fmacro-prefix-map=$GITHUB_WORKSPACE/kernel_workspace=. -ffile-prefix-map=$GITHUB_WORKSPACE/kernel_workspace=."
        export KRUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE/kernel_workspace=."
        ENV
        cat > kernel_workspace/apply-patch.sh <<'PATCH'
        # source 此文件后，在要修改的源码目录调用 apply_checked /path/to/file.patch
        apply_checked() {
          local patch_file="$1"
          if git apply --check "$patch_file"; then
            git apply "$patch_file"
            sha256sum "$patch_file" >> "$GITHUB_WORKSPACE/dist/build-info.txt"
          elif git apply --reverse --check "$patch_file"; then
            echo "补丁已包含：$patch_file"
            printf 'ALREADY_APPLIED ' >> "$GITHUB_WORKSPACE/dist/build-info.txt"
            sha256sum "$patch_file" >> "$GITHUB_WORKSPACE/dist/build-info.txt"
          else
            echo "::error::补丁不适用于当前源码：$patch_file"
            return 1
          fi
        }
        PATCH
        ccache --max-size "$CCACHE_MAXSIZE"
        ccache --set-config compression=true
    - name: 固定已开机的 KernelSU-Next 源码和版本元数据
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/05-step.log") 2>&1
        set -euo pipefail
        cd kernel_workspace
        git init KernelSU-Next
        git -C KernelSU-Next remote add origin https://github.com/pershoot/KernelSU-Next.git
        # 完整祖先历史用于 Kbuild 的版本计算；不使用 shallow clone。
        git -C KernelSU-Next fetch --tags origin "$KSU_COMMIT"
        git -C KernelSU-Next checkout -B dev-susfs "$KSU_COMMIT"
        [[ $(git -C KernelSU-Next rev-parse HEAD) == "$KSU_COMMIT" ]]
        git -C KernelSU-Next merge-base --is-ancestor "$KSU_VERSION_BASE" HEAD
        [[ $(git -C KernelSU-Next rev-list --count "$KSU_VERSION_BASE") == 3313 ]]
        [[ $(git -C KernelSU-Next describe --tags --abbrev=0 "$KSU_VERSION_BASE") == v3.4.0 ]]
        # 仅固定本地构建用 ref，不写远端；复现原任务的 33313/v3.4.0。
        git -C KernelSU-Next update-ref refs/remotes/origin/dev "$KSU_VERSION_BASE"
        test -f KernelSU-Next/kernel/Kconfig
        test ! -e common/drivers/kernelsu
        ln -s ../../KernelSU-Next/kernel common/drivers/kernelsu
        python3 - <<'PY'
        from pathlib import Path
        p = Path('common/drivers/Kconfig')
        s = p.read_text()
        assert s.endswith('endmenu\n'), 'ACK drivers/Kconfig layout changed'
        p.write_text(s[:-len('endmenu\n')] + 'source "drivers/kernelsu/Kconfig"\nendmenu\n')
        p = Path('common/drivers/Makefile')
        with p.open('a') as f:
            f.write('\nobj-$(CONFIG_KSU) += kernelsu/\n')
        PY
        echo 'KSU_DIR=KernelSU-Next' >> "$GITHUB_ENV"
        {
          echo "KSU_COMMIT=$KSU_COMMIT"
          echo "KSU_VERSION_BASE=$KSU_VERSION_BASE"
          echo 'KSU_VERSION=33313 KSU_TAG=v3.4.0'
          echo 'KBUILD_GENDWARFKSYMS_STABLE=1'
          echo 'BASELINE_RUN=https://github.com/yuwenhua653/oppo_oplus_realme_sm8850/actions/runs/36854083282'
        } >> "$GITHUB_WORKSPACE/dist/build-info.txt"
    - name: 修正 KernelSU 在 ACK r38 的独立输出目录包含路径
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/06-step.log") 2>&1
        set -euo pipefail
        ksu_root=$(realpath kernel_workspace/common/drivers/kernelsu)
        test -f "$ksu_root/Kbuild"
        test -f "$ksu_root/Kconfig"
        # uapi 是仓库根目录源码，kernel/include/uapi 是指向它的符号链接。
        # 若源码或链接确实缺失，先报错，不能靠忽略错误继续编译。
        if [[ -f "$ksu_root/policy/allowlist.h" ]] && \
           grep -Fq '"uapi/app_profile.h"' "$ksu_root/policy/allowlist.h"; then
          if [[ ! -s "$ksu_root/include/uapi/app_profile.h" ]]; then
            echo "::error::KernelSU 头文件或符号链接缺失：$ksu_root/include/uapi/app_profile.h"
            exit 1
          fi
        fi
        # 本 tag 的 scripts/Makefile.build 已把 VPATH 加入 $(src)。
        # O=out 时应使用 ../drivers/kernelsu/include，不能再次拼接 $(srctree)。
        if ! grep -Fxq 'ccflags-y += -I$(src) -I$(src)/include' "$ksu_root/Kbuild"; then
          cat >> "$ksu_root/Kbuild" <<'KBUILD'

        # ACK r38 out-of-tree include paths
        ccflags-y += -I$(src) -I$(src)/include
        KBUILD
        fi
        git -C "$ksu_root" diff --binary -- Kbuild > "$GITHUB_WORKSPACE/dist/kernelsu-build-fix.patch"
        sha256sum "$GITHUB_WORKSPACE/dist/kernelsu-build-fix.patch" >> "$GITHUB_WORKSPACE/dist/build-info.txt"
    - name: 生成并核验最终配置
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/07-step.log") 2>&1
        set -euo pipefail
        source kernel_workspace/build-env.sh
        cd kernel_workspace/common
        make O=out LLVM=1 ARCH=arm64 rustavailable
        make O=out LLVM=1 ARCH=arm64 gki_defconfig
        config() { scripts/config --file out/.config "$@"; }
        # 版本来自 Makefile 和已校验的 tag，不改 SUBLEVEL，不冒用原厂构建号。
        config --set-str LOCALVERSION '' --disable LOCALVERSION_AUTO --disable TRIM_UNUSED_KSYMS
        config --enable RUST --enable MODVERSIONS --enable GENDWARFKSYMS
        required_y=(RUST MODVERSIONS GENDWARFKSYMS ARM64_4K_PAGES)
        if [[ "$KSU_TYPE" != none ]]; then
          config --enable KSU --enable TMPFS_XATTR --enable TMPFS_POSIX_ACL
          required_y+=(KSU TMPFS_XATTR TMPFS_POSIX_ACL)
        fi
        if [[ "$SUSFS_ENABLE" == true ]]; then
          config --enable KSU_SUSFS
          required_y+=(KSU_SUSFS)
          # SUSFS 子选项随分支变化，使用其自身 Kconfig 默认值。
        elif [[ "$KSU_TYPE" != none ]]; then
          config --disable KSU_SUSFS
        fi
        if [[ "$BBR_ENABLE" != false ]]; then
          for option in TCP_CONG_ADVANCED TCP_CONG_BBR TCP_CONG_CUBIC NET_SCH_FQ; do
            config --enable "$option"
            required_y+=("$option")
          done
          if [[ "$BBR_ENABLE" == default ]]; then
            config --disable DEFAULT_CUBIC --enable DEFAULT_BBR --set-str DEFAULT_TCP_CONG bbr
          fi
        fi
        if [[ "$BETTER_NET" == true ]]; then
          net_options=(NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_SET IP_SET
            IP_SET_BITMAP_IP IP_SET_BITMAP_IPMAC IP_SET_BITMAP_PORT
            IP_SET_HASH_IP IP_SET_HASH_IPMARK IP_SET_HASH_IPPORT IP_SET_HASH_IPPORTIP
            IP_SET_HASH_IPPORTNET IP_SET_HASH_IPMAC IP_SET_HASH_MAC IP_SET_HASH_NETPORTNET
            IP_SET_HASH_NET IP_SET_HASH_NETNET IP_SET_HASH_NETPORT IP_SET_HASH_NETIFACE
            IP_SET_LIST_SET IP6_NF_NAT IP6_NF_TARGET_MASQUERADE)
          for option in "${net_options[@]}"; do config --enable "$option"; done
          config --set-val IP_SET_MAX 65534
          required_y+=("${net_options[@]}")
        fi
        if [[ "$BASEBAND_GUARD" == true ]]; then
          config --enable BBG
          required_y+=(BBG)
          lsm=$(scripts/config --file out/.config --state LSM)
          [[ "$lsm" != undef && "$lsm" != n ]] || { echo '::error::CONFIG_LSM 不存在'; exit 1; }
          if [[ ",$lsm," != *,baseband_guard,* ]]; then
            config --set-str LSM "$lsm,baseband_guard"
          fi
        fi
        make O=out LLVM=1 ARCH=arm64 olddefconfig
        # kernelrelease 不会主动同步配置，先更新 auto.conf 以免读到旧后缀。
        make O=out LLVM=1 ARCH=arm64 syncconfig
        for option in "${required_y[@]}"; do
          grep -qx "CONFIG_${option}=y" out/.config || { echo "::error::配置未生效：CONFIG_$option"; exit 1; }
        done
        grep -qx 'CONFIG_ANDROID_BINDER_IPC_RUST=m' out/.config
        grep -qx '# CONFIG_TRIM_UNUSED_KSYMS is not set' out/.config
        grep -qx 'CONFIG_GKI_TASK_STRUCT_VENDOR_SIZE_MAX=1024' out/.config
        if [[ "$KSU_TYPE" == none ]] && grep -Eq '^CONFIG_KSU=[ym]$' out/.config; then exit 1; fi
        if [[ "$SUSFS_ENABLE" != true ]] && grep -qx 'CONFIG_KSU_SUSFS=y' out/.config; then exit 1; fi
        if [[ "$BBR_ENABLE" == default ]]; then grep -qx 'CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config; fi
        if [[ "$BASEBAND_GUARD" == true ]]; then grep '^CONFIG_LSM=' out/.config | grep -q baseband_guard; fi
        release=$(make -s O=out LLVM=1 ARCH=arm64 kernelrelease)
        [[ "$release" == "$EXPECTED_VERSION$LOCALVERSION" ]] || { echo "::error::版本标识异常：$release"; exit 1; }
        echo "KERNEL_RELEASE=$release" >> "$GITHUB_ENV"
        echo "KERNEL_RELEASE=$release" >> "$GITHUB_WORKSPACE/dist/build-info.txt"
        cp out/.config "$GITHUB_WORKSPACE/dist/kernel.config"
        git diff --binary > "$GITHUB_WORKSPACE/dist/ack-changes.patch"
        git status --short > "$GITHUB_WORKSPACE/dist/ack-status.txt"
        # 硬性对照已开机那次 kernel.config，禁止试编过程改变 GKI 配置。
        printf '%s  %s\n' "$BASE_CONFIG_SHA256" out/.config | sha256sum --check
        for option in SIDE_FINGERPRINT FOD_FINGERPRINT FP_MTK_PLATFORM FP_HAVE_MULTI_SCREEN; do
          if grep -Eq "^CONFIG_${option}=[ym]$" out/.config; then
            echo "::error::Unexpected fingerprint mode: CONFIG_$option"
            exit 1
          fi
        done
        grep -qx 'CONFIG_ANDROID_BINDER_IPC=y' out/.config
        grep -qx 'CONFIG_MODULE_SIG_ALL=y' out/.config
        grep -qx 'CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"' out/.config
        grep -qx '# CONFIG_MODULE_COMPRESS is not set' out/.config
    - name: 同一输出目录编译 Image 和完整 GKI modules
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/08-kernel.log") 2>&1
        set -euo pipefail
        source kernel_workspace/build-env.sh
        if [[ "$WORKFLOW_CCACHE_DEBUG" == true ]]; then
          export CCACHE_LOGFILE="$GITHUB_WORKSPACE/dist/ccache.log"
        fi
        cd kernel_workspace/common
        set +e
        make -j"$(nproc)" O=out LLVM=1 ARCH=arm64 CC='ccache clang' Image modules \
          2>&1 | tee "$GITHUB_WORKSPACE/dist/image-and-modules-build.log"
        build_pipe_status=("${PIPESTATUS[@]}")
        set -e
        printf 'make=%s\ntee=%s\n' "${build_pipe_status[0]}" "${build_pipe_status[1]}" \
          > "$GITHUB_WORKSPACE/dist/gki-modules/build-status.txt"
        [[ "${build_pipe_status[0]}" == 0 ]] || exit "${build_pipe_status[0]}"
        [[ "${build_pipe_status[1]}" == 0 ]] || exit "${build_pipe_status[1]}"
        test -s out/arch/arm64/boot/Image
        for file in vmlinux.symvers Module.symvers System.map modules.order modules.builtin modules.builtin.modinfo; do
          test -s "out/$file"
          cp "out/$file" "$GITHUB_WORKSPACE/dist/$file"
        done
        cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/dist/Image"
        printf '%s  %s\n' "$BASE_CONFIG_SHA256" out/.config | sha256sum --check
        grep -Fq 'KernelSU-Next version: 33313' "$GITHUB_WORKSPACE/dist/image-and-modules-build.log"
        grep -Fq 'KernelSU-Next tag: v3.4.0' "$GITHUB_WORKSPACE/dist/image-and-modules-build.log"
        sha256sum "$PWD/out/arch/arm64/boot/Image" "$PWD/out/.config" \
          "$PWD/out/Module.symvers" "$PWD/out/vmlinux.symvers" \
          > "$GITHUB_WORKSPACE/dist/gki-modules/kernel-base.sha256"
        ccache --show-stats
      id: kernel
    - name: 安装、签名验证并打包 GKI modules staging
      id: gki_stage
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/09-gki_stage.log") 2>&1
        set -euo pipefail
        source kernel_workspace/build-env.sh
        gki="$GITHUB_WORKSPACE/dist/gki-modules"
        out="$GITHUB_WORKSPACE/kernel_workspace/common/out"
        stage="$GITHUB_WORKSPACE/kernel_workspace/gki-staging"
        test ! -e "$stage"
        mkdir -p "$stage"
        test -x /usr/sbin/depmod
        test -x /usr/sbin/modinfo
        command -v llvm-strip
        llvm-strip --version > "$gki/strip-version.txt"
        /usr/sbin/depmod --version > "$gki/depmod-version.txt"
        test -s "$out/System.map"
        test -s "$out/Module.symvers"
        test -s "$out/certs/signing_key.x509"
        grep -qx 'CONFIG_MODULE_SIG_ALL=y' "$out/.config"
        # In-tree modules_install copies, strips, then signs. Never strip installed modules again.
        set +e
        make -C kernel_workspace/common -j"$(nproc)" O=out LLVM=1 ARCH=arm64 CC='ccache clang' \
