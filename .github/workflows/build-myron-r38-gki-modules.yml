        #!/usr/bin/env python3
        """Build pinned, isolated external-module candidates; never installs modules or changes .config."""
        import argparse
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path, PurePosixPath
        import re
        import shlex
        import signal
        import subprocess
        import sys
        import time
        from urllib.parse import quote

        GPL_LICENSES = {"GPL", "GPL v2", "GPL and additional rights", "Dual BSD/GPL", "Dual MIT/GPL", "Dual MPL/GPL"}
        NAME = re.compile(r"[A-Za-z_][A-Za-z0-9_]*\Z")
        HEX40 = re.compile(r"[0-9a-f]{40}\Z")
        HEX64 = re.compile(r"[0-9a-f]{64}\Z")
        LIMITATION = "Build and static symbol/metadata checks only; not proof of complete type ABI, device behavior or safe installation. No module was installed."


        class TrialError(Exception):
            pass


        def require(condition, message):
            if not condition:
                raise TrialError(message)


        def digest(path):
            return hashlib.sha256(Path(path).read_bytes()).hexdigest()


        def kernel_hashes(out):
            return {name: digest(out / name) for name in
                    ("arch/arm64/boot/Image", ".config", "Module.symvers", "vmlinux.symvers")}


        def review_notes(entry):
            result = []
            for field in ("source_review_notes", "known_source_issues"):
                notes = entry.get(field, [])
                if isinstance(notes, str):
                    notes = [notes]
                require(isinstance(notes, list), "Invalid source review notes")
                for note in notes:
                    require(isinstance(note, (str, dict)), "Invalid source review note")
                    if isinstance(note, dict):
                        location = str(note.get("source_path", ""))
                        if "line" in note:
                            location += ":" + str(note["line"])
                        note = " ".join(str(x) for x in (note.get("code", ""), location, note.get("detail", "")) if x)
                    result.append(note)
            return list(dict.fromkeys(result))


        def write_json(path, value):
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")


        def local_path(text):
            require(isinstance(text, str) and text and "\\" not in text, "Invalid relative path")
            p = PurePosixPath(text)
            require(not p.is_absolute() and all(x not in (".", "..") for x in p.parts), "Unsafe relative path: " + text)
            require(re.fullmatch(r"[A-Za-z0-9_./+-]+", text) is not None, "Unsupported path characters: " + text)
            return p


        def load_helper(path):
            spec = importlib.util.spec_from_file_location("batch_elf_helper", path)
            module = importlib.util.module_from_spec(spec)
            sys.modules[spec.name] = module
            spec.loader.exec_module(module)
            return module


        def run(command, log, timeout, cwd=None):
            log.parent.mkdir(parents=True, exist_ok=True)
            with log.open("a") as stream:
                stream.write("$ " + shlex.join([str(x) for x in command]) + "\n")
                stream.flush()
                process = subprocess.Popen(command, cwd=cwd, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                try:
                    code = process.wait(timeout=timeout)
                except subprocess.TimeoutExpired:
                    os.killpg(process.pid, signal.SIGTERM)
                    try:
                        process.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        os.killpg(process.pid, signal.SIGKILL)
                        process.wait()
                    stream.write("\nTIMEOUT after %s seconds\n" % timeout)
                    raise TrialError("Subprocess timed out; see " + str(log))
                require(code == 0, "Subprocess exited %d; see %s" % (code, log))


        def download(url, path, log, timeout, sha256=None, blob=None):
            require(url.startswith("https://"), "Downloads must use HTTPS")
            path.parent.mkdir(parents=True, exist_ok=True)
            temp = path.with_name(path.name + ".download")
            run(["curl", "--fail", "--location", "--retry", "2", "--connect-timeout", "20", "--max-time", "120", url, "--output", str(temp)], log, timeout)
            data = temp.read_bytes()
            if sha256:
                require(HEX64.fullmatch(sha256) is not None, "Invalid expected SHA256")
                require(hashlib.sha256(data).hexdigest() == sha256, "SHA256 mismatch: " + url)
            if blob:
                require(HEX40.fullmatch(blob) is not None, "Invalid expected Git blob SHA1")
                actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                require(actual == blob, "Git blob mismatch: " + url)
            require(sha256 or blob, "Unpinned download")
            temp.replace(path)


        def read_symvers(path):
            result = {}
            for number, line in enumerate(Path(path).read_text().splitlines(), 1):
                if not line:
                    continue
                parts = line.split("\t")
                require(len(parts) in (4, 5), "Malformed symvers line %d in %s" % (number, path))
                crc, name, owner, export_type = parts[:4]
                namespace = parts[4] if len(parts) == 5 else ""
                require(re.fullmatch(r"0x[0-9a-fA-F]{1,8}", crc) is not None, "Invalid symvers CRC")
                require(name and not any(c.isspace() for c in name), "Invalid symbol name")
                require(owner and export_type in ("EXPORT_SYMBOL", "EXPORT_SYMBOL_GPL"), "Invalid symbol owner/type")
                require(name not in result, "Duplicate symbol in symvers: " + name)
                result[name] = {"crc": "0x%08x" % int(crc, 16), "provider": owner, "export_type": export_type, "namespace": namespace}
            return result


        def module_name(module):
            names = module.modinfo.get("name", [])
            require(len(names) == 1 and NAME.fullmatch(names[0]), "Missing/ambiguous module name")
            return names[0]


        def exports_as_suppliers(module):
            return {name: dict(value, provider=module_name(module)) for name, value in module.exports.items()}


        def merge_suppliers(target, source):
            for name, value in source.items():
                require(name not in target, "Multiple providers for symbol: " + name)
                target[name] = value


        def audit_imports(module, suppliers):
            errors, checks = [], []
            for name in set(module.basic) & set(module.extended):
                if module.basic[name] != module.extended[name]:
                    errors.append("Basic/extended CRC disagreement: " + name)
            versions = dict(module.basic)
            versions.update(module.extended)
            strong_imports = {symbol["name"] for symbol in module.symbols
                              if symbol["section"] == 0 and symbol["name"] and symbol["binding"] == 1}
            missing = strong_imports - set(versions)
            errors.extend("Import lacks CRC: " + name for name in sorted(missing))
            unexpected = set(versions) - set(module.imports) - {"module_layout"}
            errors.extend("CRC record without matching import: " + name for name in sorted(unexpected))
            for name in sorted(set(module.imports) - strong_imports - set(versions)):
                checks.append({"symbol": name, "consumer_crc": None, "supplier": suppliers.get(name),
                               "status": "OPTIONAL_WEAK_UNVERSIONED"})
            if "module_layout" not in versions:
                errors.append("Missing module_layout CRC")
            licenses = set(module.modinfo.get("license", []))
            gpl = bool(licenses) and licenses.issubset(GPL_LICENSES)
            namespaces = set(module.modinfo.get("import_ns", []))
            for name, crc in sorted(versions.items()):
                provider = suppliers.get(name)
                status = "MATCH"
                if provider is None:
                    status = "MISSING_PROVIDER"
                elif crc != provider["crc"]:
                    status = "CRC_MISMATCH"
                elif provider["export_type"] == "EXPORT_SYMBOL_GPL" and not gpl:
                    status = "GPL_LICENSE_MISMATCH"
                elif provider["namespace"] and provider["namespace"] not in namespaces:
                    status = "NAMESPACE_NOT_IMPORTED"
                checks.append({"symbol": name, "consumer_crc": crc, "supplier": provider, "status": status})
                if status != "MATCH":
                    errors.append(name + ": " + status)
            return errors, checks


        def audit_candidate(candidate, reference, suppliers, expected_name, release, generated_symvers):
            errors, checks = audit_imports(candidate, suppliers)
            if module_name(candidate) != expected_name or module_name(reference) != expected_name:
                errors.append("Candidate/reference module name differs from manifest")
            magic = candidate.modinfo.get("vermagic", [])
            stock_magic = reference.modinfo.get("vermagic", [])
            if len(magic) != 1 or not magic[0].split() or magic[0].split()[0] != release:
                errors.append("Candidate release differs from this kernel build")
            elif len(stock_magic) != 1 or magic[0].split()[1:] != stock_magic[0].split()[1:]:
                errors.append("Candidate/reference vermagic feature flags differ")
            aliases = set(candidate.modinfo.get("alias", []))
            stock_aliases = set(reference.modinfo.get("alias", []))
            if aliases != stock_aliases:
                errors.append("Candidate/reference aliases differ")
            for name, expected in reference.exports.items():
                if candidate.exports.get(name) != expected:
                    errors.append("Stock export missing or changed CRC/namespace/type: " + name)
            for name, value in candidate.exports.items():
                if name in suppliers:
                    errors.append("Candidate export conflicts with retained provider: " + name)
                record = generated_symvers.get(name)
                if record is None or any(record.get(k) != v for k, v in value.items()):
                    errors.append("Candidate export differs from actual generated Module.symvers: " + name)
            if set(generated_symvers) != set(candidate.exports):
                errors.append("Generated Module.symvers export set differs from candidate ELF")
            changes = {
                "aliases_added": sorted(aliases - stock_aliases), "aliases_removed": sorted(stock_aliases - aliases),
                "imports_added": sorted(set(candidate.imports) - set(reference.imports)),
                "imports_removed": sorted(set(reference.imports) - set(candidate.imports)),
                "exports_added": sorted(set(candidate.exports) - set(reference.exports)),
                "depends": {"reference": reference.modinfo.get("depends", []), "candidate": candidate.modinfo.get("depends", [])},
            }
            return {"status": "FAIL" if errors else "PASS", "errors": errors, "checks": checks, "changes": changes,
                    "candidate": candidate.summary(), "reference": reference.summary(), "limitations": LIMITATION}


        def write_extra_symvers(path, suppliers):
            lines = ["\t".join((entry["crc"], name, entry["provider"], entry["export_type"], entry["namespace"]))
                     for name, entry in sorted(suppliers.items())]
            path.write_text("\n".join(lines) + ("\n" if lines else ""))


        def validate_source_edits(entry):
            edits = entry.get("source_edits", [])
            require(isinstance(edits, list), "source_edits must be a list")
            inputs = entry.get("source_files", []) + entry.get("include_files", [])
            paths = {item["path"] for item in inputs}
            seen = set()
            required = {"path", "before_sha256", "after_sha256", "content", "reason"}
            for edit in edits:
                require(isinstance(edit, dict) and set(edit) == required, "Invalid source_edits fields")
                path = edit["path"]
                require(str(local_path(path)) == path and path in paths, "Source edit must name a listed, canonical input path")
                require(path not in seen, "Duplicate source edit: " + path)
                seen.add(path)
                for field in ("before_sha256", "after_sha256"):
                    require(isinstance(edit[field], str) and HEX64.fullmatch(edit[field]), "Invalid source edit " + field)
                require(isinstance(edit["content"], str), "Source edit content must be UTF-8 text")
                require(isinstance(edit["reason"], str) and edit["reason"].strip(), "Source edit requires a reason")
            return edits


        def source_fix_records(entry):
            return [{key: edit[key] for key in ("path", "before_sha256", "after_sha256", "reason")} | {"status": "NOT_APPLIED"}
                    for edit in entry.get("source_edits", [])]


        def apply_source_edits(entry, work, output, records):
            """Apply only fully pinned edits after original files passed their Git blob checks."""
            edits = validate_source_edits(entry)
            if not edits:
                return
            inputs = entry.get("source_files", []) + entry.get("include_files", [])
            provenance = {"status": "VALIDATING", "edits": records, "limitations": LIMITATION}
            try:
                for item in inputs:
                    original = output / "original-source" / item["path"]
                    original.parent.mkdir(parents=True, exist_ok=True)
                    original.write_bytes((work / item["path"]).read_bytes())
                prepared = []
                # Check every edit before changing any work file; no partial application on a pin mismatch.
                for edit in edits:
                    require(digest(work / edit["path"]) == edit["before_sha256"], "Source edit before SHA256 mismatch: " + edit["path"])
                    content = edit["content"].encode("utf-8", errors="strict")
                    require(hashlib.sha256(content).hexdigest() == edit["after_sha256"], "Source edit after SHA256 mismatch: " + edit["path"])
                    prepared.append(content)
                for edit, content, record in zip(edits, prepared, records):
                    (work / edit["path"]).write_bytes(content)
                    require(digest(work / edit["path"]) == edit["after_sha256"], "Written source edit SHA256 mismatch: " + edit["path"])
                    record["status"] = "APPLIED"
                for item in inputs:
                    patched = output / "source" / item["path"]
                    patched.parent.mkdir(parents=True, exist_ok=True)
                    patched.write_bytes((work / item["path"]).read_bytes())
                provenance["status"] = "APPLIED"
            except Exception as error:
                provenance.update(status="FAIL", error=type(error).__name__ + ": " + str(error))
                raise
            finally:
                write_json(output / "source-edits-applied.json", provenance)


        def validate_manifest(manifest):
            for field in ("source_repository", "stock_repository"):
                require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", manifest[field]) is not None, "Invalid repository")
            for field in ("source_commit", "stock_commit"):
                require(HEX40.fullmatch(manifest[field]) is not None, "A full pinned commit is required")
            names = [entry["name"] for entry in manifest["modules"]]
            require(names and len(names) == len(set(names)) and all(NAME.fullmatch(x) for x in names), "Invalid/duplicate module names")
            for entry in manifest["modules"]:
                review_notes(entry)
                source_repository = entry.get("source_repository", manifest["source_repository"])
                source_commit = entry.get("source_commit", manifest["source_commit"])
                require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", source_repository) is not None, "Invalid module source repository")
                require(HEX40.fullmatch(source_commit) is not None, "Module source override needs a full pinned commit")
                require(entry["objects"], "Empty object list: " + entry["name"])
                for obj in entry["objects"]:
                    local_path(obj)
                    require(obj.endswith(".o"), "Object must end in .o")
                paths = []
                for item in entry.get("source_files", []) + entry.get("include_files", []):
                    local_path(item["path"]); local_path(item["source_path"])
                    require(HEX40.fullmatch(item["git_blob_sha1"]) is not None, "Unpinned source file")
                    paths.append(item["path"])
                require(paths and len(paths) == len(set(paths)), "Empty/duplicate source paths")
                require(not {"Kbuild", "Makefile", "Module.symvers", "modules.order"} & set(paths), "Source collides with generated build metadata")
                validate_source_edits(entry)
                for flag in entry.get("ccflags", []):
                    valid = re.fullmatch(r"-D[A-Za-z_][A-Za-z0-9_]*(?:=[A-Za-z0-9_]+)?|-I\$\(src\)(?:/[A-Za-z0-9_./+-]+)?", flag)
                    require(valid is not None and ".." not in flag.split("/"), "Unsupported ccflag: " + flag)
                dependencies = entry.get("batch_dependencies", [])
        BATCH_SCRIPT_PART_3
