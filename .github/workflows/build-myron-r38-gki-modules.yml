              "source_path": "include/linux/soc/qcom/panel_event_notifier.h",
              "path": "include/linux/soc/qcom/panel_event_notifier.h",
              "git_blob_sha1": "c20d5549b601ce6d4faac29365ab1ce3db7a258a",
              "byte_count": 2527,
              "source_url": "https://github.com/MiCode/Xiaomi_Kernel_OpenSource/blob/45705be1220b4cfa8100516ad86711656c0b634e/include/linux/soc/qcom/panel_event_notifier.h"
            },
            {
              "source_path": "drivers/input/fingerprint/mi_fp/modules.bzl",
              "path": "modules.bzl",
              "git_blob_sha1": "8cb227ebe149775742e167238b45dbba785afe96",
              "byte_count": 697,
              "source_url": "https://github.com/MiCode/Xiaomi_Kernel_OpenSource/blob/45705be1220b4cfa8100516ad86711656c0b634e/drivers/input/fingerprint/mi_fp/modules.bzl"
            },
            {
              "source_path": "drivers/input/fingerprint/mi_fp/Kconfig",
              "path": "Kconfig",
              "git_blob_sha1": "b02e10479213d19718169455e2472dded6a4192b",
              "byte_count": 530,
              "source_url": "https://github.com/MiCode/Xiaomi_Kernel_OpenSource/blob/45705be1220b4cfa8100516ad86711656c0b634e/drivers/input/fingerprint/mi_fp/Kconfig"
            }
          ]
        }
        MI_SOURCE_MANIFEST
        # 固定提交的原始内容；逐文件核验 git blob id，拒绝 HTML/错误页/源文件漂移。
        python3 - <<'PY'
        import hashlib, json, os, pathlib, subprocess
        base = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        manifest = json.loads((base/'dist/mi_fp-diagnostic/source-manifest.json').read_text())
        root = base/'kernel_workspace/mi_fp'
        for entry in manifest['files']:
            dest = root/entry['path']
            dest.parent.mkdir(parents=True, exist_ok=True)
            url = 'https://raw.githubusercontent.com/' + manifest['repository'] + '/' + manifest['commit'] + '/' + entry['source_path']
            subprocess.run(['curl', '-fL', '--retry', '3', url, '-o', str(dest)], check=True)
            b = dest.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
            assert actual == entry['git_blob_sha1'] and len(b) == entry['byte_count'], entry['path']
        PY
        cat > "$module_root/Kbuild" <<'KBUILD'
        obj-m := mi_fp.o
        mi_fp-y := fp_driver.o fp_platform.o fp_netlink.o fp_input.o
        ccflags-y += -I$(src)/include
        # retained stock provider exists; enable only the external module's declarations.
        ccflags-y += -DCONFIG_QCOM_PANEL_EVENT_NOTIFIER=1
        KBUILD
        cp "$module_root/Kbuild" "$diag/Kbuild"
        cp "$GITHUB_WORKSPACE/kernel_workspace/mi_fp_audit.py" "$diag/mi_fp_audit.py"
        stock_url="https://raw.githubusercontent.com/Evolution-X-Devices/kernel_xiaomi_myron-prebuilt/$STOCK_COMMIT/vendor_dlkm"
        curl -fL --retry 3 "$stock_url/mi_fp.ko" -o "$diag/reference/mi_fp.ko"
        curl -fL --retry 3 "$stock_url/panel_event_notifier.ko" -o "$diag/reference/panel_event_notifier.ko"
        {
          echo "MI_SOURCE_COMMIT=$MI_SOURCE_COMMIT"
          echo "STOCK_COMMIT=$STOCK_COMMIT"
          echo 'TRIAL=mi_fp only; stock panel_event_notifier retained'
        } >> "$GITHUB_WORKSPACE/dist/build-info.txt"
      if: always() && steps.batch_setup.outcome == 'success'
    - name: 准备外部模块链接文件并建立 mi_fp 构建基准
      id: module_prepare
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/12-module_prepare.log") 2>&1
        set -euo pipefail
        source kernel_workspace/build-env.sh
        diag="$GITHUB_WORKSPACE/dist/mi_fp-diagnostic"
        out="$GITHUB_WORKSPACE/kernel_workspace/common/out"
        python3 kernel_workspace/mi_fp_audit.py prepare \
          --reference "$diag/reference/mi_fp.ko" \
          --provider "$diag/reference/panel_event_notifier.ko" \
          --core-symvers "$out/vmlinux.symvers" --outdir "$diag/prepare"
        # 保留 make Image modules 生成的完整符号表，绝不以核心表覆盖。
        # 原厂 provider 的真实导出仍由 KBUILD_EXTRA_SYMBOLS 独立传入。
        test -s "$out/Module.symvers"
        cp "$out/Module.symvers" "$diag/kernel.Module.symvers"
        cp "$out/.config" "$diag/kernel.config.before"
        sha256sum "$out/arch/arm64/boot/Image" "$out/.config" "$out/vmlinux.symvers" "$out/Module.symvers" > "$diag/base-before.sha256"
        # 完整 modules 构建已生成 module.lds；仍执行同环境准备并检查基线未改变。
        # 必须使用相同环境、相同输出目录，不带 M= 执行 modules_prepare。
        if [[ -s "$out/scripts/module.lds" ]]; then
          sha256sum "$out/scripts/module.lds" > "$diag/module-lds.before.txt"
        else
          echo 'scripts/module.lds: missing or empty before modules_prepare' > "$diag/module-lds.before.txt"
        fi
        set +e
        make -C kernel_workspace/common -j"$(nproc)" O=out LLVM=1 ARCH=arm64 \
          CC='ccache clang' modules_prepare 2>&1 | tee "$diag/modules-prepare.log"
        prepare_pipe_status=("${PIPESTATUS[@]}")
        set -e
        printf '%s\n' "${prepare_pipe_status[0]}" > "$diag/modules-prepare-exit-code.txt"
        printf '%s\n' "${prepare_pipe_status[1]}" > "$diag/modules-prepare-log-exit-code.txt"
        if [[ -s "$out/scripts/module.lds" ]]; then
          cp "$out/scripts/module.lds" "$diag/module.lds"
          sha256sum "$out/scripts/module.lds" > "$diag/module-lds.after.txt"
        else
          echo 'scripts/module.lds: missing or empty after modules_prepare' > "$diag/module-lds.after.txt"
        fi
        sha256sum --check "$diag/base-before.sha256"
        [[ "${prepare_pipe_status[0]}" == 0 ]] || exit "${prepare_pipe_status[0]}"
        [[ "${prepare_pipe_status[1]}" == 0 ]] || exit "${prepare_pipe_status[1]}"
        if [[ ! -s "$out/scripts/module.lds" ]]; then
          echo '::error::modules_prepare did not generate out/scripts/module.lds'
          exit 1
        fi
      if: always() && steps.module_source.outcome == 'success'
    - name: 试编 mi_fp（不安装、不打入 AnyKernel3）
      id: module
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/13-module.log") 2>&1
        set -euo pipefail
        source kernel_workspace/build-env.sh
        module_root="$GITHUB_WORKSPACE/kernel_workspace/mi_fp"
        diag="$GITHUB_WORKSPACE/dist/mi_fp-diagnostic"
        mkdir -p "$diag/candidate"
        set +e
        make -C kernel_workspace/common -j"$(nproc)" O=out LLVM=1 ARCH=arm64 \
          CC='ccache clang' M="$module_root" \
          KBUILD_EXTRA_SYMBOLS="$diag/prepare/panel-event-notifier.symvers" modules \
          2>&1 | tee "$diag/build.log"
        pipe_status=("${PIPESTATUS[@]}")
        build_status=${pipe_status[0]}
        log_status=${pipe_status[1]}
        set -e
        printf '%s\n' "$build_status" > "$diag/build-exit-code.txt"
        printf '%s\n' "$log_status" > "$diag/log-exit-code.txt"
        if [[ -f "$module_root/mi_fp.ko" ]]; then cp "$module_root/mi_fp.ko" "$diag/candidate/"; fi
        if [[ -f "$module_root/mi_fp.mod.c" ]]; then cp "$module_root/mi_fp.mod.c" "$diag/candidate/"; fi
        if [[ -f "$module_root/Module.symvers" ]]; then cp "$module_root/Module.symvers" "$diag/candidate/"; fi
        if [[ -f "$module_root/modules.order" ]]; then cp "$module_root/modules.order" "$diag/candidate/"; fi
        for target in mi_fp.o mi_fp.mod.c mi_fp.mod.o .module-common.o modules.order mi_fp.ko; do
          if [[ -f "$module_root/$target" ]]; then
            stat -c '%n: %s bytes' "$module_root/$target"
          else
            printf '%s: missing\n' "$module_root/$target"
          fi
        done > "$diag/module-targets.txt"
        cp kernel_workspace/common/out/.config "$diag/kernel.config.after"
        sha256sum --check "$diag/base-before.sha256"
        [[ "$build_status" == 0 ]] || exit "$build_status"
        [[ "$log_status" == 0 ]] || exit "$log_status"
        test -s "$diag/candidate/mi_fp.ko"
      if: always() && steps.module_prepare.outcome == 'success'
    - name: 审计新模块的导入 CRC、依赖和设备绑定
      id: module_verify
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/14-module_verify.log") 2>&1
        set -euo pipefail
        source kernel_workspace/build-env.sh
        diag="$GITHUB_WORKSPACE/dist/mi_fp-diagnostic"
        python3 kernel_workspace/mi_fp_audit.py verify \
          --reference "$diag/reference/mi_fp.ko" \
          --provider "$diag/reference/panel_event_notifier.ko" \
          --core-symvers kernel_workspace/common/out/vmlinux.symvers \
          --candidate "$diag/candidate/mi_fp.ko" --expected-release "$KERNEL_RELEASE" --outdir "$diag/verify"
        readelf -p .modinfo "$diag/candidate/mi_fp.ko" > "$diag/candidate/modinfo.txt"
        sha256sum "$diag/candidate/mi_fp.ko" > "$diag/candidate/SHA256SUMS"
        {
          echo '### mi_fp 试编与符号版本检查通过'
          echo '候选模块位于独立的 myron-mi-fp-diagnostic artifact，不包含自动安装脚本。'
          echo '导入 CRC 由 modpost 从真实供应者符号表取得；检查通过不等于完整类型 ABI、ioctl 或硬件行为已验证。'
          echo '触控、充电、panel_event_notifier 继续使用现有原厂模块。'
        } >> "$GITHUB_STEP_SUMMARY"
        mkdir -p "$diag/install-candidate"
        # This raw external-module build is unsigned. Strip a separate copy; never mutate the original.
        llvm-strip --strip-debug -o "$diag/install-candidate/mi_fp.ko" "$diag/candidate/mi_fp.ko"
        python3 - <<'PY_STRIP'
        import hashlib, importlib.util, json, os
        from pathlib import Path
        base = Path(os.environ['GITHUB_WORKSPACE'])
        spec = importlib.util.spec_from_file_location('mi_fp_audit',base/'kernel_workspace/mi_fp_audit.py')
        audit = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(audit)
        diag = base/'dist/mi_fp-diagnostic'
        before = audit.ElfModule(diag/'candidate/mi_fp.ko')
        after = audit.ElfModule(diag/'install-candidate/mi_fp.ko')
        marker = b'~Module signature appended~\n'
        assert not before.data.endswith(marker) and not after.data.endswith(marker), 'Do not strip a signed module'
        def allocated(module):
            return {s['name']:({k:s[k] for k in ['type','flags','addr','size','align','entsize']},
                None if s['type']==8 else module.body(s)) for s in module.sections if s['flags']&2}
        def symbol(module, sym):
            return {**{k:v for k,v in sym.items() if k!='section'},
                'section':module.sections[sym['section']]['name'] if 0<sym['section']<len(module.sections) else str(sym['section'])}
        def relocations(module):
            return sorted([(module.sections[index]['name'],offset,kind,symbol(module,sym),addend)
                for (index,offset),(kind,sym,addend) in module.relocations.items()
                if module.sections[index]['flags']&2],key=lambda row:(row[0],row[1]))
        assert allocated(before)==allocated(after), 'Runtime section changed during strip'
        assert relocations(before)==relocations(after), 'Runtime relocation changed during strip'
        for field in ['modinfo','imports','exports','basic','extended']:
            assert getattr(before,field)==getattr(after,field), 'Changed '+field
        report = {'status':'PASS','operation':'llvm-strip --strip-debug on unsigned copy',
            'allocated_sections':len(allocated(before)),'runtime_relocations':len(relocations(before)),
            'original_bytes':len(before.data),'stripped_bytes':len(after.data),
            'original_sha256':hashlib.sha256(before.data).hexdigest(),
            'stripped_sha256':hashlib.sha256(after.data).hexdigest()}
        (diag/'install-candidate/strip-verification.json').write_text(json.dumps(report,indent=2)+'\n')
        print(json.dumps(report))
        PY_STRIP
        python3 kernel_workspace/mi_fp_audit.py verify \
          --reference "$diag/reference/mi_fp.ko" --provider "$diag/reference/panel_event_notifier.ko" \
          --core-symvers kernel_workspace/common/out/vmlinux.symvers \
          --candidate "$diag/install-candidate/mi_fp.ko" --expected-release "$KERNEL_RELEASE" \
          --outdir "$diag/verify-stripped"
        readelf -n "$diag/install-candidate/mi_fp.ko" > "$diag/install-candidate/elf-notes.txt"
        (cd "$diag/install-candidate" && sha256sum mi_fp.ko > SHA256SUMS)
        sha256sum --check "$diag/base-before.sha256"
        sha256sum --check "$GITHUB_WORKSPACE/dist/gki-modules/kernel-base.sha256"
      if: always() && steps.module.outcome == 'success'
    - name: 批量试编 5 个模块并逐项审计（单项失败继续）
      id: vendor_batch
      if: always() && steps.batch_setup.outcome == 'success'
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/vendor-batch.log") 2>&1
        source kernel_workspace/build-env.sh
        batch="$GITHUB_WORKSPACE/dist/vendor-batch"
        base="$GITHUB_WORKSPACE/dist/gki-modules/kernel-base.sha256"
        sha256sum --check "$base"
        cp "$base" "$batch/kernel-base.sha256"
        set +e
        python3 kernel_workspace/myron_vendor_batch.py   --manifest kernel_workspace/vendor-batch-manifest.json   --work-root kernel_workspace/vendor-batch   --output "$batch"   --kernel-source kernel_workspace/common   --kernel-out kernel_workspace/common/out   --elf-helper kernel_workspace/mi_fp_audit.py   --release "$KERNEL_RELEASE" --jobs "$(nproc)"   --build-timeout 900 --download-timeout 180
        batch_exit=$?
        sha256sum --check "$base"
        base_exit=$?
        set -e
        printf 'batch=%s\nbaseline=%s\n' "$batch_exit" "$base_exit" > "$batch/step-exit-codes.txt"
        [[ "$base_exit" == 0 ]] || exit "$base_exit"
        exit "$batch_exit"
    - name: 保存 r38 编译缓存
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
      if: always() && steps.kernel.outcome == 'success'
    - name: 保留试编阶段状态
      if: always()
      env:
        KERNEL_STEP_OUTCOME: ${{ steps.kernel.outcome }}
        SOURCE_STEP_OUTCOME: ${{ steps.module_source.outcome }}
        PREPARE_STEP_OUTCOME: ${{ steps.module_prepare.outcome }}
        MODULE_STEP_OUTCOME: ${{ steps.module.outcome }}
        VERIFY_STEP_OUTCOME: ${{ steps.module_verify.outcome }}
        GKI_STEP_OUTCOME: ${{ steps.gki_stage.outcome }}
        BATCH_SETUP_OUTCOME: ${{ steps.batch_setup.outcome }}
        BATCH_STEP_OUTCOME: ${{ steps.vendor_batch.outcome }}
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/logs"
        exec > >(tee "$GITHUB_WORKSPACE/dist/logs/16-step.log") 2>&1
        set -euo pipefail
        diag="$GITHUB_WORKSPACE/dist/mi_fp-diagnostic"
        mkdir -p "$diag"
        printf 'kernel=%s\ngki_stage=%s\nmodule_source=%s\nmodule_prepare=%s\nmodule_build=%s\nmodule_verify=%s\n' \
          "$KERNEL_STEP_OUTCOME" "$GKI_STEP_OUTCOME" "$SOURCE_STEP_OUTCOME" "$PREPARE_STEP_OUTCOME" \
          "$MODULE_STEP_OUTCOME" "$VERIFY_STEP_OUTCOME" > "$diag/step-status.txt"
        if [[ -f dist/build-info.txt ]]; then cp dist/build-info.txt "$diag/build-info.txt"; fi
        if [[ -f dist/kernel.config ]]; then cp dist/kernel.config "$diag/kernel.config"; fi
        if [[ -f dist/vmlinux.symvers ]]; then cp dist/vmlinux.symvers "$diag/vmlinux.symvers"; fi
        gki="$GITHUB_WORKSPACE/dist/gki-modules"
        mkdir -p "$gki"
        cp "$diag/step-status.txt" "$gki/step-status.txt"
        for file in build-info.txt kernel.config Module.symvers vmlinux.symvers System.map; do
          if [[ -f "dist/$file" ]]; then cp "dist/$file" "$gki/$file"; fi
        done
        # Do not copy the entire output tree: it contains the private signing key.
        out="$GITHUB_WORKSPACE/kernel_workspace/common/out"
        for file in Module.symvers vmlinux.symvers modules.order modules.builtin modules.builtin.modinfo; do
          if [[ -f "$out/$file" && ! -f "$gki/$file" ]]; then cp "$out/$file" "$gki/$file"; fi
        done
        if [[ -f "$out/.config" && ! -f "$gki/kernel.config" ]]; then cp "$out/.config" "$gki/kernel.config"; fi
        if [[ -f "$gki/gki-modules-${KERNEL_RELEASE:-unavailable}.tar.gz" ]]; then
          (cd "$gki" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
        fi

        batch="$GITHUB_WORKSPACE/dist/vendor-batch"
        mkdir -p "$batch"
        cp "$diag/step-status.txt" "$batch/step-status.txt"
        printf 'batch_setup=%s\nvendor_batch=%s\n' "$BATCH_SETUP_OUTCOME" "$BATCH_STEP_OUTCOME" >> "$batch/step-status.txt"
        for file in build-info.txt kernel.config Module.symvers vmlinux.symvers; do
          if [[ -f "dist/$file" ]]; then cp "dist/$file" "$batch/$file"; fi
        done
        python3 - <<'BATCH_OVERVIEW_PY'
        import hashlib, json, os
        from pathlib import Path
        batch = Path(os.environ['GITHUB_WORKSPACE'])/'dist/vendor-batch'
        labels = [('Image + all configured GKI modules','KERNEL_STEP_OUTCOME'),
                  ('Signed GKI staging','GKI_STEP_OUTCOME'),
                  ('mi_fp source','SOURCE_STEP_OUTCOME'),
                  ('mi_fp preparation','PREPARE_STEP_OUTCOME'),
                  ('mi_fp build','MODULE_STEP_OUTCOME'),
                  ('mi_fp static audit + stripped-copy verification','VERIFY_STEP_OUTCOME'),
                  ('Batch setup','BATCH_SETUP_OUTCOME'),('Five-module batch','BATCH_STEP_OUTCOME')]
        lines = ['# Myron r38 one-run build overview','','| Stage | Outcome |','|---|---|']
        lines += ['| '+label+' | '+os.environ.get(env,'unknown')+' |' for label,env in labels]
        lines += ['', 'A passed build/static audit is not hardware validation or installation approval.',
                  'Image is built once. New external modules are trial artifacts; AnyKernel3 contains Image only.', '']
        detail = batch/'summary.md'
        if detail.exists():
            lines.append(detail.read_text())
        else:
            lines.append('Batch was not completed; inspect step-status.txt and the CI logs.')
        selection = batch/'source-selection.json'
        if selection.exists():
            data = json.loads(selection.read_text())
            lines += ['', '## Source work deferred', '']
            lines += ['- '+item['name']+': '+item['reason'] for item in data.get('deferred',[])]
        text = '\n'.join(lines)+'\n'
        (batch/'overview.md').write_text(text)
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
            stream.write('\n'+text)
        entries = [hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(batch))
                   for p in sorted(batch.rglob('*')) if p.is_file() and not p.is_symlink() and p.name!='SHA256SUMS']
        (batch/'SHA256SUMS').write_text('\n'.join(entries)+'\n')
        BATCH_OVERVIEW_PY
    - name: 上传内核及构建信息
      uses: actions/upload-artifact@v4
      with:
        name: ACK-6.12.38-r38-gki-modules-${{ github.run_id }}
        path: |
          dist/
          !dist/mi_fp-diagnostic/**
          !dist/gki-modules/**
          !dist/vendor-batch/**
        if-no-files-found: warn
        retention-days: '14'
        compression-level: '1'
        include-hidden-files: false
      if: always()
    - name: 上传独立 mi_fp 试编记录（失败也保留）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: myron-mi-fp-diagnostic-${{ github.run_id }}
        path: dist/mi_fp-diagnostic/
        if-no-files-found: warn
        retention-days: 14
        compression-level: 6
    - name: 上传独立 GKI modules staging 与审核记录（失败也保留）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: myron-r38-gki-modules-staging-${{ github.run_id }}
        path: dist/gki-modules/
        if-no-files-found: warn
        retention-days: 14
        compression-level: 1
    - name: 上传批量模块结果与统一报告（失败也保留）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: myron-r38-vendor-batch-${{ github.run_id }}
        path: dist/vendor-batch/
        if-no-files-found: warn
        retention-days: 14
        compression-level: 6
