        # Myron r38 vendor module batch

        One Image + GKI modules build is shared by all external module trials. This artifact
        contains five new Xiaomi/Qualcomm module trials; mi_fp keeps its established
        independent build and audit. overview.md includes the status of all stages.

        Each module has its pinned manifest, source, stock reference, build log and status.
