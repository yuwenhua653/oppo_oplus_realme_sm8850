        checks passed; it does not prove full type/CFI ABI or hardware behavior. No new
        module is installed or included in AnyKernel3, and no vendor_dlkm/system_dlkm
        image is generated. mi_ubt lifetime fixes are not a complete panic-context audit;
        the copied stack boundary is a snapshot and subsequent user reads may fail.

        The panel_event_notifier trial is independent of mi_fp: the established mi_fp
        path still links against its verified original provider. A passing provider
        export check does not by itself certify all downstream devices or callbacks.

