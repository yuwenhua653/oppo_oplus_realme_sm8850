        import hashlib, json, os, struct, subprocess, tempfile
        from pathlib import Path
        base = Path(os.environ['GITHUB_WORKSPACE'])
        release = os.environ['KERNEL_RELEASE']
        gki = base/'dist/gki-modules'
        stage = base/'kernel_workspace/gki-staging'
        moddir = stage/'lib/modules'/release
        cert = gki/'signing-certificate.pem'
        modules = sorted(moddir.rglob('*.ko'))
        assert modules, 'No installed modules'
        assert not list(stage.rglob('*.ko.xz')) and not list(stage.rglob('*.ko.zst')), 'Unexpected compression'
        assert not any(p.is_symlink() for p in stage.rglob('*')), 'Unexpected staging symlink'
        marker = b'~Module signature appended~\n'
        manifest = []
        for path in modules:
            data = path.read_bytes()
            assert data.endswith(marker), 'Missing module signature: '+str(path)
            header = len(data)-len(marker)-12
            algo, hash_id, kind, signer_len, key_len, reserved, sig_len = struct.unpack_from('>5B3sI', data, header)
            assert kind == 2 and signer_len == 0 and key_len == 0 and reserved == b'\0'*3, str(path)
            assert 0 < sig_len < header, str(path)
            unsigned, signature = data[:header-sig_len], data[header-sig_len:header]
            with tempfile.TemporaryDirectory() as temp:
                temp = Path(temp)
                (temp/'module').write_bytes(unsigned)
                (temp/'signature.der').write_bytes(signature)
                # -noverify skips CA-chain checking; -nointern forces our same-build certificate.
                # The detached content signature itself is still cryptographically verified.
                result = subprocess.run(['openssl','cms','-verify','-binary','-inform','DER',
                    '-in',str(temp/'signature.der'),'-content',str(temp/'module'),
                    '-certfile',str(cert),'-nointern','-noverify','-out',os.devnull],
                    stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                assert result.returncode == 0, str(path)+': '+result.stderr
            fields = {}
            for field in ['name','vermagic','depends','signer','sig_key','sig_hashalgo']:
                fields[field] = subprocess.check_output(['/usr/sbin/modinfo','-F',field,str(path)],text=True).strip()
            assert fields['vermagic'].split()[0] == release, str(path)
            assert fields['sig_hashalgo'] == 'sha1', str(path)
            manifest.append({'path':str(path.relative_to(moddir)), 'size':len(data),
                'sha256':hashlib.sha256(data).hexdigest(), 'signature_verified_with_same_build_cert':True,
                **fields})
