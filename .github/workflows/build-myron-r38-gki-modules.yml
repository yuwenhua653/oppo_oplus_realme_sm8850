        (bounded decimal parsing), mi_ubt (mm reference and VMA lifetime).
        Original source first passes its Git blob check, then before/after SHA256 gates
        the correction. original-source/ and source/ preserve both versions, with
        source-edits-applied.json recording application. Corrected outputs require a new
        build/static audit and hardware validation; the old run did not test these fixes.
        When linking succeeds, candidate/ contains the unstripped .ko and real Module.symvers.
        audit.json checks current imports, namespaces, GPL compatibility, release/aliases,
        and preservation of every original exported CRC, namespace and export type.
        Source/build/audit failure in one module does not stop independent modules.
        A changed Image, .config or kernel symbol table stops the batch.

