                require(len(dependencies) == len(set(dependencies)) and entry["name"] not in dependencies and set(dependencies).issubset(names), "Invalid batch dependencies")
                retained_names = {item["name"] for item in entry.get("stock_providers", [])}
                require(not retained_names.intersection(names), "Stock provider is also in this batch; declare a batch dependency instead")


        def ordered_modules(entries):
            pending = list(entries)
            complete = set()
            while pending:
                ready = [x for x in pending if set(x.get("batch_dependencies", [])).issubset(complete)]
                require(ready, "Cyclic batch dependencies")
                for entry in ready:
                    yield entry
                    complete.add(entry["name"])
                    pending.remove(entry)


        def checksums(directory):
            lines = [digest(p) + "  " + str(p.relative_to(directory)) for p in sorted(directory.rglob("*"))
                     if p.is_file() and not p.is_symlink() and p.name != "SHA256SUMS"]
            (directory / "SHA256SUMS").write_text("\n".join(lines) + "\n")


        def build_one(entry, manifest, args, helper, core, successful):
            name = entry["name"]
            work = args.work_root / name
            output = args.output / name
            output.mkdir(parents=True, exist_ok=True)
            result = {"name": name, "status": "PREPARING", "stage": "source", "errors": [], "limitations": LIMITATION,
                      "source_review_notes": review_notes(entry), "known_source_issues": entry.get("known_source_issues", []),
                      "source_fixes": source_fix_records(entry)}
            started = time.monotonic()
            write_json(output / "manifest.json", entry)
            try:
                blocked = [dep for dep in entry.get("batch_dependencies", []) if dep not in successful]
                if blocked:
                    result.update(status="BLOCKED_DEPENDENCY", errors=["Upstream not successful: " + ", ".join(blocked)])
                    return result
                require(not work.exists(), "Work directory already exists: " + str(work))
                work.mkdir(parents=True)
                source_repository = entry.get("source_repository", manifest["source_repository"])
                source_commit = entry.get("source_commit", manifest["source_commit"])
                for item in entry.get("source_files", []) + entry.get("include_files", []):
                    url = "https://raw.githubusercontent.com/%s/%s/%s" % (source_repository, source_commit, quote(item["source_path"], safe="/"))
                    download(url, work / item["path"], output / "source.log", args.download_timeout, blob=item["git_blob_sha1"])
                apply_source_edits(entry, work, output, result["source_fixes"])
                reference_path = output / "reference" / (name + ".ko")
                reference = entry["reference"]
                download(reference["url"], reference_path, output / "source.log", args.download_timeout, sha256=reference["sha256"])
                stock = helper.ElfModule(reference_path)
                require(module_name(stock) == name, "Reference name differs from manifest")
                extra = {}
                for dep in entry.get("batch_dependencies", []):
                    merge_suppliers(extra, successful[dep])
                providers = []
                provider_names = set()
                for provider in entry.get("stock_providers", []):
                    require(NAME.fullmatch(provider["name"]) is not None and provider["name"] not in provider_names, "Invalid/duplicate stock provider")
                    require(provider["name"] != name and provider["name"] not in entry.get("batch_dependencies", []), "Stock provider conflicts with rebuilt module")
                    provider_names.add(provider["name"])
                    target = output / "reference" / (provider["name"] + ".ko")
                    download(provider["url"], target, output / "source.log", args.download_timeout, sha256=provider["sha256"])
                    parsed = helper.ElfModule(target)
                    require(module_name(parsed) == provider["name"], "Stock provider name differs from manifest")
                    providers.append(parsed)
                    merge_suppliers(extra, exports_as_suppliers(parsed))
                suppliers = dict(core)
                merge_suppliers(suppliers, extra)
                provider_report = []
                for provider in providers:
                    errors, checked = audit_imports(provider, suppliers)
                    provider_report.append({"name": module_name(provider), "errors": errors, "checks": checked, "metadata": provider.summary()})
                write_json(output / "stock-provider-audit.json", provider_report)
                require(not any(item["errors"] for item in provider_report), "Retained stock provider fails current supplier CRC audit")
                extra_path = output / "extra-symbols.symvers"
                write_extra_symvers(extra_path, extra)
                lines = ["obj-m := " + name + ".o"]
                if entry["objects"] != [name + ".o"]:
                    require(name + ".o" not in entry["objects"], "Composite module cannot contain itself")
                    lines.append(name + "-y := " + " ".join(entry["objects"]))
                if entry.get("ccflags"):
                    lines.append("ccflags-y += " + " ".join(entry["ccflags"]))
                (work / "Kbuild").write_text("\n".join(lines) + "\n")
                (output / "Kbuild").write_text((work / "Kbuild").read_text())
                source_dest = output / "source"
                source_dest.mkdir(exist_ok=True)
                # Preserve pinned input source and headers, not mutable object files or output-tree links.
                for item in entry.get("source_files", []) + entry.get("include_files", []):
                    dest = source_dest / item["path"]
                    dest.parent.mkdir(parents=True, exist_ok=True)
                    dest.write_bytes((work / item["path"]).read_bytes())
                result["stage"] = "build"
                command = ["make", "-C", str(args.kernel_source), "-j" + str(args.jobs), "O=" + str(args.kernel_out),
                           "LLVM=1", "LLVM_IAS=1", "ARCH=arm64", "CC=ccache clang", "M=" + str(work)]
                if extra:
                    command.append("KBUILD_EXTRA_SYMBOLS=" + str(extra_path))
                command.append("modules")
                run(command, output / "build.log", args.build_timeout)
                result["stage"] = "audit"
                candidate_path = output / "candidate" / (name + ".ko")
                candidate_path.parent.mkdir()
                require((work / (name + ".ko")).is_file(), "Build did not produce expected module")
                candidate_path.write_bytes((work / (name + ".ko")).read_bytes())
                for filename in ("Module.symvers", "modules.order", name + ".mod.c"):
                    if (work / filename).is_file():
                        (output / "candidate" / filename).write_bytes((work / filename).read_bytes())
                candidate = helper.ElfModule(candidate_path)
                generated = read_symvers(work / "Module.symvers")
                audit = audit_candidate(candidate, stock, suppliers, name, args.release, generated)
                write_json(output / "audit.json", audit)
                require(not audit["errors"], "; ".join(audit["errors"]))
