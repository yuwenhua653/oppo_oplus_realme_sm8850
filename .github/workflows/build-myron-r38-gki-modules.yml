        stock = set((gki/'stock-release-module-paths.txt').read_text().splitlines())
        assert any(path.endswith('/drivers/android/rust_binder.ko') for path in actual), 'Rust binder was not produced'
        comparison = {'stock_count':len(stock),'staged_count':len(actual),
            'added':sorted(actual-stock),'missing':sorted(stock-actual),
            'note':'Set differences are for review, not an instruction to change the device module set. Directory labels do not prove ABI compatibility.'}
        (gki/'module-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
        (gki/'stock-module-comparison.json').write_text(json.dumps(comparison,indent=2)+'\n')
        print('Verified signed modules:',len(manifest),'stock:',len(stock),
              'added:',len(comparison['added']),'missing:',len(comparison['missing']))
        PY_GKI
        sha256sum --check "$gki/kernel-base.sha256"
        tar -czf "$gki/gki-modules-$KERNEL_RELEASE.tar.gz" -C "$stage" lib
        gzip -t "$gki/gki-modules-$KERNEL_RELEASE.tar.gz"
