        - manifest.json: fixed source blobs and stock SHA256 references
        - <module>/source-edits-applied.json: source correction provenance when present
        - SHA256SUMS: output integrity checks

        Other artifacts from the same run carry Image/AnyKernel3, the mi_fp trial,
        and signed GKI staging. GKI staging must be paired with this run's Image.
