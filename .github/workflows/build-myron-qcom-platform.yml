name: Myron QCOM platform source build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'full: build all; analyze: dependency analysis only; soc/dtbs: isolate a failure'
        type: choice
        required: true
        default: full
        options:
          - full
          - analyze
          - soc
          - dtbs
      jobs:
        description: Parallel build jobs
        type: choice
        required: true
        default: '2'
        options:
          - '2'
          - '4'

permissions:
  contents: read

concurrency:
  group: myron-qcom-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_NODEBUG: 'true'
      PYTHONUNBUFFERED: '1'
      WORKSPACE_DIR: ${{ github.workspace }}/kernel_workspace/myron-platform-r1
      PACKAGE_DIR: ${{ github.workspace }}/myron-qcom-platform-r1
      BUILD_STAGE: ${{ inputs.stage }}
      BUILD_JOBS: ${{ inputs.jobs }}
    steps:
      - name: Checkout integration files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract uploaded integration ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          archive = root / "myron-qcom-platform-r1.zip"
          expected = "770dd907a0d51984a5d005285daef648859f6f7db68576cf98ec823d41b52ca2"
          if not archive.is_file():
              raise SystemExit("Upload myron-qcom-platform-r1.zip to the repository root first.")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("ZIP checksum mismatch: upload the original myron-qcom-platform-r1.zip.")
          count = 0
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe archive path: " + item.filename)
                  if not path.parts or path.parts[0] != "myron-qcom-platform-r1":
                      continue
                  bundle.extract(item, root)
                  count += not item.is_dir()
          if count != 67 or not (root / "myron-qcom-platform-r1/sources.lock.json").is_file():
              raise SystemExit("Integration package is incomplete.")
          print(f"Verified ZIP and extracted {count} integration files.")
          PYTHON

      - name: Prepare hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_DIR/sources.lock.json"
          # These are unused preinstalled SDKs on this disposable GitHub-hosted job.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zstd lz4 rsync zip unzip cpio pkg-config
          df -h .
          free -h

      - name: Sync pinned platform sources
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PACKAGE_DIR/sync_sources.py" --workspace "$WORKSPACE_DIR" --jobs 4

      - name: Fix stale QPACE deletion and enable progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          workspace = Path(os.environ["WORKSPACE_DIR"])
          package = Path(os.environ["PACKAGE_DIR"])
          dt = workspace / "vendor/qcom/sm8850-devicetrees"
          expected_head = "8b86fedda64183338411f9751f5e62ce25997620"
          head = subprocess.check_output(["git", "-C", str(dt), "rev-parse", "HEAD"], text=True).strip()
          if head != expected_head:
              raise SystemExit("QPACE hotfix requires the pinned r1 DT revision.")
          canoe = dt / "qcom/canoe.dtsi"
          if hashlib.sha256(canoe.read_bytes()).hexdigest() != "888b1e020c95f6ab2c186b0433ff9cbc9cc49b1ea4f2fe92edc034fd8274f261":
              raise SystemExit("Unexpected base DT; cannot verify that QPACE was already removed.")

          edits = [
              (
                  dt / "qcom/alor-interposer-common.dtsi",
                  "2fe19c5a4865e7d4e42121af1cccddcb10de0485de95852914abe480883c6926",
                  "1db1a0bf08b3422459e6c2f278ad1b9e607fe15b5080ac6514bd78f9a54e5e0a",
                  b"/delete-node/ &qcom_qpace;\n",
                  b"",
              ),
              (
                  package / "build_platform.py",
                  "cac195dbffe144b86cb7f16b7af3110e560cb830f9c2e9c47cf5b4bdd2c08009",
                  "0cfc2318dcd5755cce2be2093179d00b55436ef5588cfd41ff7549b065b79059",
                  b'"--noshow_progress"',
                  b'"--show_progress", "--show_progress_rate_limit=30", "--progress_report_interval=30"',
              ),
          ]
          pending = []
          records = []
          for path, before, after, old, new in edits:
              data = path.read_bytes()
              current = hashlib.sha256(data).hexdigest()
              if current == after:
                  records.append({"path": str(path), "status": "already_applied", "sha256": after})
                  continue
              if current != before or data.count(old) != 1:
                  raise SystemExit("Unexpected contents; refusing to overwrite: " + str(path))
              fixed = data.replace(old, new, 1)
              if hashlib.sha256(fixed).hexdigest() != after:
                  raise SystemExit("Hotfix output checksum mismatch: " + str(path))
              pending.append((path, fixed))
              records.append({"path": str(path), "status": "applied", "sha256": after})

          # Validate every input before writing any file; reruns accept only exact outputs.
          for path, fixed in pending:
              path.write_bytes(fixed)
          report = workspace / "integration-reports/qpace-progress-hotfix.json"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({
              "hotfix": "r1-qpace-progress-fix1",
              "dt_revision": expected_head,
              "reason": "QPACE node is already absent; remove only its stale delete-node directive.",
              "files": records,
          }, indent=2) + "\n")
          print("QPACE stale deletion fixed; Bazel progress enabled (30s reports).")
          PYTHON

      - name: Apply integration and run selected build
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DEBUG
          # Resource snapshots distinguish a silent action from runner exhaustion.
          python3 -u - <<'HEARTBEAT' &
          import datetime
          import os
          import subprocess
          import time

          while True:
              time.sleep(60)
              stamp = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
              print("::group::Runner heartbeat " + stamp, flush=True)
              for command in [
                  ["free", "-m"],
                  ["df", "-h", os.environ["WORKSPACE_DIR"]],
                  ["ps", "-eo", "pid,ppid,pcpu,pmem,etime,comm", "--sort=-pcpu"],
              ]:
                  try:
                      result = subprocess.run(command, text=True, capture_output=True, timeout=10)
                      output = result.stdout.splitlines()
                      if command[0] == "ps":
                          output = output[:13]
                      print("\n".join(output), flush=True)
                      if result.returncode:
                          print("Monitor command exited:", command[0], result.returncode, flush=True)
                  except (OSError, subprocess.TimeoutExpired) as error:
                      print("Monitor:", error, flush=True)
              print("::endgroup::", flush=True)
          HEARTBEAT
          heartbeat_pid=$!
          stop_heartbeat() {
            local build_rc=$?
            trap - EXIT
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
            exit "$build_rc"
          }
          trap stop_heartbeat EXIT
          python3 "$PACKAGE_DIR/build_platform.py" --workspace "$WORKSPACE_DIR" --stage "$BUILD_STAGE" --jobs "$BUILD_JOBS" --ram-mb 10000

      - name: Upload source lock and diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myron-qcom-reports-${{ github.run_id }}
          path: |
            ${{ env.WORKSPACE_DIR }}/integration-reports/
            ${{ env.PACKAGE_DIR }}/sources.lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled diagnostic outputs
        if: success() && inputs.stage != 'analyze'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myron-qcom-source-build-${{ inputs.stage }}-${{ github.run_id }}
          path: ${{ env.WORKSPACE_DIR }}/integration-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
