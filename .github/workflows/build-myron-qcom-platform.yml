name: Myron QCOM platform source build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'full: build all; analyze: dependency analysis only; soc/dtbs: isolate a failure'
        type: choice
        required: true
        default: full
        options:
          - full
          - analyze
          - soc
          - dtbs
      jobs:
        description: Parallel build jobs
        type: choice
        required: true
        default: '2'
        options:
          - '2'
          - '4'

permissions:
  contents: read

concurrency:
  group: myron-qcom-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_NODEBUG: 'true'
      PYTHONUNBUFFERED: '1'
      WORKSPACE_DIR: ${{ github.workspace }}/kernel_workspace/myron-platform-r1
      PACKAGE_DIR: ${{ github.workspace }}/myron-qcom-platform-r1
      BUILD_STAGE: ${{ inputs.stage }}
      BUILD_JOBS: ${{ inputs.jobs }}
    steps:
      - name: Checkout integration files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract uploaded integration ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          archive = root / "myron-qcom-platform-r1.zip"
          expected = "770dd907a0d51984a5d005285daef648859f6f7db68576cf98ec823d41b52ca2"
          if not archive.is_file():
              raise SystemExit("Upload myron-qcom-platform-r1.zip to the repository root first.")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("ZIP checksum mismatch: upload the original myron-qcom-platform-r1.zip.")
          count = 0
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe archive path: " + item.filename)
                  if not path.parts or path.parts[0] != "myron-qcom-platform-r1":
                      continue
                  bundle.extract(item, root)
                  count += not item.is_dir()
          if count != 67 or not (root / "myron-qcom-platform-r1/sources.lock.json").is_file():
              raise SystemExit("Integration package is incomplete.")
          print(f"Verified ZIP and extracted {count} integration files.")
          PYTHON

      - name: Prepare hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PACKAGE_DIR/sources.lock.json"
          # These are unused preinstalled SDKs on this disposable GitHub-hosted job.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zstd lz4 rsync zip unzip cpio pkg-config
          df -h .
          free -h

      - name: Sync pinned platform sources
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PACKAGE_DIR/sync_sources.py" --workspace "$WORKSPACE_DIR" --jobs 4

      - name: Fix stale QPACE deletion and enable progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          workspace = Path(os.environ["WORKSPACE_DIR"])
          package = Path(os.environ["PACKAGE_DIR"])
          dt = workspace / "vendor/qcom/sm8850-devicetrees"
          expected_head = "8b86fedda64183338411f9751f5e62ce25997620"
          head = subprocess.check_output(["git", "-C", str(dt), "rev-parse", "HEAD"], text=True).strip()
          if head != expected_head:
              raise SystemExit("QPACE hotfix requires the pinned r1 DT revision.")
          canoe = dt / "qcom/canoe.dtsi"
          if hashlib.sha256(canoe.read_bytes()).hexdigest() != "888b1e020c95f6ab2c186b0433ff9cbc9cc49b1ea4f2fe92edc034fd8274f261":
              raise SystemExit("Unexpected base DT; cannot verify that QPACE was already removed.")

          edits = [
              (
                  dt / "qcom/alor-interposer-common.dtsi",
                  "2fe19c5a4865e7d4e42121af1cccddcb10de0485de95852914abe480883c6926",
                  "1db1a0bf08b3422459e6c2f278ad1b9e607fe15b5080ac6514bd78f9a54e5e0a",
                  b"/delete-node/ &qcom_qpace;\n",
                  b"",
              ),
              (
                  package / "build_platform.py",
                  "cac195dbffe144b86cb7f16b7af3110e560cb830f9c2e9c47cf5b4bdd2c08009",
                  "0cfc2318dcd5755cce2be2093179d00b55436ef5588cfd41ff7549b065b79059",
                  b'"--noshow_progress"',
                  b'"--show_progress", "--show_progress_rate_limit=30", "--progress_report_interval=30"',
              ),
          ]
          pending = []
          records = []
          for path, before, after, old, new in edits:
              data = path.read_bytes()
              current = hashlib.sha256(data).hexdigest()
              if current == after:
                  records.append({"path": str(path), "status": "already_applied", "sha256": after})
                  continue
              if current != before or data.count(old) != 1:
                  raise SystemExit("Unexpected contents; refusing to overwrite: " + str(path))
              fixed = data.replace(old, new, 1)
              if hashlib.sha256(fixed).hexdigest() != after:
                  raise SystemExit("Hotfix output checksum mismatch: " + str(path))
              pending.append((path, fixed))
              records.append({"path": str(path), "status": "applied", "sha256": after})

          # Validate every input before writing any file; reruns accept only exact outputs.
          for path, fixed in pending:
              path.write_bytes(fixed)
          report = workspace / "integration-reports/qpace-progress-hotfix.json"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({
              "hotfix": "r1-qpace-progress-fix1",
              "dt_revision": expected_head,
              "reason": "QPACE node is already absent; remove only its stale delete-node directive.",
              "files": records,
          }, indent=2) + "\n")
          print("QPACE stale deletion fixed; Bazel progress enabled (30s reports).")
          PYTHON

      - name: Fix Myron DTBO output collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          workspace = Path(os.environ["WORKSPACE_DIR"])
          # Keep the original r1 archive; update only its reviewed DT integration files.
          # Basename declarations use Kleaf's recursive lookup from the DT repository root.
          edits = [
              {
                  'path': 'devicetrees/myron-dt-integration.patch',
                  'before_sha256': 'c0934e8cfc229561fa62f7844f6e2cb5e6415ffe261916bb566f0ac75ab5af74',
                  'after_sha256': '1eb047983a06ecfae3c88ef06c3ae9f7fd336fc214fc5f8b057e7fba2c2e1571',
                  "replacements": [
                      (
                          '+            # This does not define the OEM dtbo.img table or overlay ordering.\n+            {"name": "audio/myron-audio-mtp.dtbo"},\n+            {"name": "camera/myron-sm8850-camera-sensor.dtbo"},\n+            {"name": "display/display/myron-sde-display-mtp-overlay.dtbo"},\n             {"name": "pandora-sm8850-overlay.dtbo"},\n',
                          '+            # This does not define the OEM dtbo.img table or overlay ordering.\n+            {"name": "myron-audio-mtp.dtbo"},\n+            {"name": "myron-sm8850-camera-sensor.dtbo"},\n+            {"name": "myron-sde-display-mtp-overlay.dtbo"},\n             {"name": "pandora-sm8850-overlay.dtbo"},\n',
                      ),
                  ],
              },
              {
                  'path': 'devicetrees/myron-dt-patch-manifest.json',
                  'before_sha256': '50abdcf04f749015f2d9cb5324b40b5cff8fb145966e53dd651869c243bc7870',
                  'after_sha256': 'f41f9badbdf915563ac6c9c8a9fc6930015a77dad9e1822e4e207cd6e94c6191',
                  "replacements": [
                      (
                          '  },\n  "patch_sha256": "c0934e8cfc229561fa62f7844f6e2cb5e6415ffe261916bb566f0ac75ab5af74",\n  "files": [\n',
                          '  },\n  "patch_sha256": "1eb047983a06ecfae3c88ef06c3ae9f7fd336fc214fc5f8b057e7fba2c2e1571",\n  "files": [\n',
                      ),
                      (
                          '      "before_sha256": "38a928850b24444d4d89d7761390e576da72688d3a6f7410d5fa08a7e42d1fac",\n      "after_sha256": "6b107daabc1a5a652d131063ce81cd6fb5a9495760f2c80c3ed1db545e8df2da"\n    },\n',
                          '      "before_sha256": "38a928850b24444d4d89d7761390e576da72688d3a6f7410d5fa08a7e42d1fac",\n      "after_sha256": "33a50ccf84bfeb9bb5387322be4c866dda238a9bb58cf4efefdd9e0f088dd357"\n    },\n',
                      ),
                  ],
              },
              {
                  'path': 'devicetrees/check-myron-dt-wiring.py',
                  'before_sha256': 'ad31a87102cae09d9c7536abdffc8bfdae41c81315f2d360d6a8e9dcb4cc9317',
                  'after_sha256': 'ade0b588932db4f73f013818fb9524cd4b7d48bd30325bbbe05646a21add1130',
                  "replacements": [
                      (
                          '            required.extend(item["name"] for item in platform_map[platform].get(group, []))\n    for name in required:\n        if name not in outputs:\n            raise ValueError("Bazel output absent from Kbuild: " + name)\n        source = dt / "qcom" / name\n        if not any(source.with_suffix(ext).is_file() for ext in (".dts", ".dtso")):\n            raise ValueError("Missing declared DT source: " + name)\n    expected = ["myron-sm8850-overlay.dtbo", "audio/myron-audio-mtp.dtbo",\n                "camera/myron-sm8850-camera-sensor.dtbo",\n                "display/display/myron-sde-display-mtp-overlay.dtbo"]\n    if not set(expected).issubset(required):\n        raise ValueError("A myron component is absent from the Bazel output list")\n    build = (dt / "BUILD.bazel").read_text()\n',
                          '            required.extend(item["name"] for item in platform_map[platform].get(group, []))\n    # Kleaf searches from the external DT repository root, not its qcom folder.\n    # Its pinned search_and_cp_output.py treats names with \'/\' as exact paths;\n    # basename-only names are found recursively and must have a unique match.\n    physical_outputs = {"qcom/" + name for name in outputs}\n    resolved_outputs = {}\n    for name in required:\n        if "/" in name:\n            matches = [name] if name in physical_outputs else []\n        else:\n            matches = sorted(path for path in physical_outputs if Path(path).name == name)\n        if len(matches) != 1:\n            raise ValueError("Kleaf output must resolve to one Kbuild file: " +\n                             name + " -> " + repr(matches))\n        resolved_outputs[name] = matches[0]\n        source = dt / matches[0]\n        if not any(source.with_suffix(ext).is_file() for ext in (".dts", ".dtso")):\n            raise ValueError("Missing declared DT source: " + str(source))\n    expected = {\n        "myron-sm8850-overlay.dtbo": "qcom/myron-sm8850-overlay.dtbo",\n        "myron-audio-mtp.dtbo": "qcom/audio/myron-audio-mtp.dtbo",\n        "myron-sm8850-camera-sensor.dtbo": "qcom/camera/myron-sm8850-camera-sensor.dtbo",\n        "myron-sde-display-mtp-overlay.dtbo": "qcom/display/display/myron-sde-display-mtp-overlay.dtbo",\n    }\n    for name, physical_path in expected.items():\n        if resolved_outputs.get(name) != physical_path:\n            raise ValueError("A myron component is absent or misrouted: " + name)\n    build = (dt / "BUILD.bazel").read_text()\n',
                      ),
                      (
                          '            raise ValueError("Missing sandbox input: " + pattern)\n    return {"status": "PASS", "scope": "GNU make and source/output wiring only",\n            "platforms": selected, "main_targets": len(top), "subsystem_targets": subcounts,\n            "declared_outputs_checked": len(required), "myron_components": expected,\n            "dtc_compilation": "NOT_RUN", "hardware_validation": "NOT_RUN",\n',
                          '            raise ValueError("Missing sandbox input: " + pattern)\n    return {"status": "PASS", "scope": "GNU make, DT source and Kleaf collection-path contract only",\n            "platforms": selected, "main_targets": len(top), "subsystem_targets": subcounts,\n            "declared_outputs_checked": len(required), "myron_components": list(expected),\n            "kleaf_resolved_outputs": resolved_outputs,\n            "dtc_compilation": "NOT_RUN", "hardware_validation": "NOT_RUN",\n',
                      ),
                  ],
              },
          ]
          pending = []
          records = []
          for edit in edits:
              path = package / edit["path"]
              data = path.read_bytes()
              current = hashlib.sha256(data).hexdigest()
              if current == edit["after_sha256"]:
                  records.append({"path": edit["path"], "status": "already_applied", "sha256": current})
                  continue
              if current != edit["before_sha256"]:
                  raise SystemExit("Unexpected DT integration contents: " + str(path))
              fixed = data
              for old, new in edit["replacements"]:
                  old, new = old.encode(), new.encode()
                  if fixed.count(old) != 1:
                      raise SystemExit("Ambiguous DT output correction: " + str(path))
                  fixed = fixed.replace(old, new, 1)
              if hashlib.sha256(fixed).hexdigest() != edit["after_sha256"]:
                  raise SystemExit("DT output correction checksum mismatch: " + str(path))
              pending.append((path, fixed))
              records.append({"path": edit["path"], "status": "applied", "sha256": edit["after_sha256"]})
          for path, fixed in pending:
              path.write_bytes(fixed)
          report = workspace / "integration-reports/dt-output-collection-hotfix.json"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({
              "hotfix": "r1-dt-output-collection-fix2",
              "reason": "Collect all three subsystem DTBOs by unique basename; validate the Kleaf lookup contract before compiling.",
              "files": records,
          }, indent=2) + "\n")
          print("Myron DTBO output declarations fixed; collection-path preflight enabled.")
          PYTHON

      - name: Enable QCOM DDK header profile and batch diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          workspace = Path(os.environ["WORKSPACE_DIR"])
          runner = package / "build_platform.py"
          # Match the reviewed runner after the existing progress hotfix.
          before = '0cfc2318dcd5755cce2be2093179d00b55436ef5588cfd41ff7549b065b79059'
          after = '323956fce205b94d0a4d00b1a81cbd9d2ff051fda66728fbeeb81c9ea970d09d'
          replacements = [
              (
                  '                 "--output_base=" + str(root / "out/bazel-integration")]\n        options = ["--cpu=aarch64", f"--jobs={args.jobs}", f"--local_ram_resources={args.ram_mb}", "--color=no", "--curses=no", "--show_progress", "--show_progress_rate_limit=30", "--progress_report_interval=30"]\n        # Only traverse this diagnostic graph. No ABL, boot/vendor_boot or dlkm image targets.\n',
                  '                 "--output_base=" + str(root / "out/bazel-integration")]\n        # QCOM\'s DDK modules require the internal ACK headers declared by the\n        # pinned SoC tree. The standalone workspace does not import device.bazelrc.\n        # Reuse the same configuration for build and cquery so collected paths\n        # refer to the outputs that were actually compiled.\n        configuration = [\n            "--cpu=aarch64",\n            "--//build/kernel/kleaf:allow_ddk_unsafe_headers",\n            "--//build/kernel/kleaf:user_ddk_unsafe_headers=//vendor/qcom/sm8850:unsafe_headers_qcom_group",\n        ]\n        options = configuration + [f"--jobs={args.jobs}", f"--local_ram_resources={args.ram_mb}", "--color=no", "--curses=no", "--show_progress", "--show_progress_rate_limit=30", "--progress_report_interval=30", "--keep_going"]\n        # Only traverse this diagnostic graph. No ABL, boot/vendor_boot or dlkm image targets.\n',
              ),
              (
                  '        if args.stage != "analyze":\n            output = subprocess.run(bazel + ["cquery", "--cpu=aarch64", "--output=files", "--color=no", "--curses=no", TARGETS[args.stage]],\n                                    cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n',
                  '        if args.stage != "analyze":\n            output = subprocess.run(bazel + ["cquery"] + configuration + ["--output=files", "--color=no", "--curses=no", TARGETS[args.stage]],\n                                    cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n',
              ),
          ]
          data = runner.read_bytes()
          current = hashlib.sha256(data).hexdigest()
          if current == after:
              status = "already_applied"
          elif current == before:
              fixed = data
              for old, new in replacements:
                  old, new = old.encode(), new.encode()
                  if fixed.count(old) != 1:
                      raise SystemExit("Ambiguous DDK runner correction")
                  fixed = fixed.replace(old, new, 1)
              if hashlib.sha256(fixed).hexdigest() != after:
                  raise SystemExit("DDK runner checksum mismatch")
              compile(fixed, str(runner), "exec")
              runner.write_bytes(fixed)
              status = "applied"
          else:
              raise SystemExit("Unexpected build runner contents; refusing DDK correction")
          report = workspace / "integration-reports/ddk-header-profile-hotfix.json"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({
              "hotfix": "r1-ddk-header-profile-fix3",
              "status": status,
              "runner_sha256": after,
              "header_group": "//vendor/qcom/sm8850:unsafe_headers_qcom_group",
              "build_and_cquery_same_configuration": True,
              "keep_going": True,
          }, indent=2) + "\n")
          print("QCOM DDK header profile enabled for build and cquery; independent failures will be collected in one run.")
          PYTHON

      - name: Collect same-build GKI modules and check dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PACKAGE_DIR/check_module_dependencies.py" <<'MODULE_CHECK'
          #!/usr/bin/env python3
          """Check collected ARM64 modules as data; never consult host module directories."""
          import argparse
          import collections
          import hashlib
          import json
          from pathlib import Path
          import struct


          def normalize(name):
              return name.replace("-", "_")


          def modinfo(path):
              data = path.read_bytes()
              if len(data) < 64 or data[:7] != b"\x7fELF\x02\x01\x01":
                  raise ValueError("expected ELF64 little-endian module")
              if struct.unpack_from("<HH", data, 16) != (1, 183):
                  raise ValueError("expected AArch64 ET_REL module")
              offset = struct.unpack_from("<Q", data, 40)[0]
              size, count, names_index = struct.unpack_from("<HHH", data, 58)
              if size != 64 or offset + size > len(data):
                  raise ValueError("invalid ELF section table")
              first = struct.unpack_from("<IIQQQQIIQQ", data, offset)
              count = count or first[5]
              names_index = first[6] if names_index == 0xffff else names_index
              if not count or offset + count * size > len(data) or names_index >= count:
                  raise ValueError("invalid ELF section count/string table")
              sections = [struct.unpack_from("<IIQQQQIIQQ", data, offset + i * size)
                          for i in range(count)]

              def contents(section):
                  start, length = section[4:6]
                  if start + length > len(data):
                      raise ValueError("ELF section extends past end of file")
                  return data[start:start + length]

              names = contents(sections[names_index])
              metadata = []
              for section in sections:
                  start = section[0]
                  end = names.find(b"\0", start)
                  if start >= len(names) or end < 0:
                      raise ValueError("invalid ELF section name")
                  if names[start:end] == b".modinfo":
                      metadata.append(contents(section))
              if len(metadata) != 1:
                  raise ValueError("expected one .modinfo section")
              fields = collections.defaultdict(list)
              for entry in metadata[0].split(b"\0"):
                  if b"=" in entry:
                      key, value = entry.decode("utf-8").split("=", 1)
                      fields[key].append(value)
              for key in ("name", "vermagic"):
                  if len(fields[key]) != 1 or not fields[key][0].strip():
                      raise ValueError("missing or ambiguous .modinfo " + key)
              name = normalize(fields["name"][0])
              if not name or any(c not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_" for c in name):
                  raise ValueError("invalid module name")
              return {
                  "name": name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "vermagic": " ".join(fields["vermagic"][0].split()),
                  "depends": sorted({normalize(d.strip()) for value in fields.get("depends", [])
                                     for d in value.split(",") if d.strip()}),
              }


          def audit(root, release_file=None, builtin_file=None, require_metadata=False, kernel_release=None):
              root = Path(root).resolve()
              if not root.is_dir():
                  raise ValueError("artifact root is not a directory")
              errors, warnings, modules = [], [], []
              for path in sorted(root.rglob("*.ko")):
                  file = str(path.relative_to(root))
                  try:
                      modules.append(dict(file=file, **modinfo(path)))
                  except (ValueError, OSError, struct.error) as exc:
                      errors.append({"kind": "invalid_module", "file": file, "error": str(exc)})
              if not modules:
                  errors.append({"kind": "no_modules"})

              metadata = {}
              def read_metadata(name, explicit):
                  paths = [Path(explicit)] if explicit else sorted(root.rglob(name))
                  values = []
                  for path in paths:
                      try:
                          value = path.read_text(encoding="utf-8")
                          metadata.setdefault(name, []).append(str(path))
                          values.append(value)
                      except (OSError, UnicodeError) as exc:
                          errors.append({"kind": "invalid_metadata", "file": str(path), "error": str(exc)})
                  if not values:
                      (errors if require_metadata else warnings).append({"kind": "missing_metadata", "file": name})
                  return values

              releases = set()
              release_values = [kernel_release] if kernel_release is not None else read_metadata("kernel.release", release_file)
              if kernel_release is not None:
                  metadata["kernel.release"] = ["explicit: " + kernel_release]
              for value in release_values:
                  if len(value.split()) != 1:
                      errors.append({"kind": "invalid_kernel_release", "value": value.strip()})
                  else:
                      releases.add(value.strip())
              if len(releases) > 1:
                  errors.append({"kind": "conflicting_kernel_releases", "values": sorted(releases)})

              builtin_sets = []
              for value in read_metadata("modules.builtin", builtin_file):
                  names = set()
                  for entry in value.splitlines():
                      entry = entry.strip()
                      if not entry:
                          continue
                      if not entry.endswith(".ko"):
                          errors.append({"kind": "invalid_builtin_entry", "value": entry})
                          continue
                      names.add(normalize(Path(entry).stem))
                  builtin_sets.append(names)
              if builtin_sets and any(names != builtin_sets[0] for names in builtin_sets[1:]):
                  errors.append({"kind": "conflicting_builtin_lists"})
              # Conflicting metadata must not make missing dependencies look satisfied.
              builtins = set.intersection(*builtin_sets) if builtin_sets else set()

              by_name = collections.defaultdict(list)
              by_vermagic = collections.defaultdict(list)
              for module in modules:
                  by_name[module["name"]].append(module)
                  by_vermagic[module["vermagic"]].append(module["name"])
                  release = module["vermagic"].split()[0]
                  if releases and release not in releases:
                      errors.append({"kind": "kernel_release_mismatch", "module": module["name"],
                                     "module_release": release, "kernel_releases": sorted(releases)})
              if len(by_vermagic) > 1:
                  errors.append({"kind": "mixed_vermagic", "values": sorted(by_vermagic)})
              duplicates = []
              for name, group in sorted(by_name.items()):
                  if len(group) > 1:
                      entry = {"module": name, "files": [m["file"] for m in group],
                               "identical": len({m["sha256"] for m in group}) == 1}
                      duplicates.append(entry)
                      if not entry["identical"]:
                          errors.append(dict(kind="conflicting_duplicate_module", **entry))

              missing = collections.defaultdict(set)
              builtin_dependencies = collections.defaultdict(set)
              for module in modules:
