name: Myron R84 fast-charge prerequisites and inactive MCA closure

on:
  push:
    branches:
      - codex/myron-r61-battery
    paths:
      - .github/workflows/build-myron-fastcharge-r84.yml
      - r84-build-route/**
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs
        type: choice
        required: true
        default: '2'
        options: ['2', '4']

permissions:
  contents: read

concurrency:
  group: myron-r84-fastcharge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_NODEBUG: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      WORKSPACE_DIR: ${{ github.workspace }}/kernel_workspace/myron-platform-r1
      PACKAGE_DIR: ${{ github.workspace }}/myron-qcom-platform-r1
      BUILD_JOBS: ${{ inputs.jobs || '2' }}
    steps:
      - name: Checkout integration files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify frozen R84 source inputs and production-function tests before sync
        shell: bash
        run: |
          set -euo pipefail
          echo '1bea452ed2f1a337b5c6e588251bdb24b816a22248fe1dde956e05fc01898eec  r84-build-route/fastcharge-contract.json' | sha256sum --check --strict
          python3 r84-build-route/build_fastcharge.py --repo-root "$GITHUB_WORKSPACE" --check-inputs
          mkdir -p "$GITHUB_WORKSPACE/r84-host-reports"
          python3 r84-build-route/test_source.py --output "$GITHUB_WORKSPACE/r84-host-reports/source" > "$GITHUB_WORKSPACE/r84-host-reports/source-test.log" 2>&1

      - name: Extract unchanged pinned source preparation bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 r55-source/ci/extract_inputs.py --root "$GITHUB_WORKSPACE"
          python3 "$GITHUB_WORKSPACE/myron-adaptation-r12/fastcheck_r12.py" \
            --reports "$GITHUB_WORKSPACE/myron-fastchecks"

      - name: Prepare hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zstd lz4 rsync zip unzip cpio pkg-config patch
          df -h .
          free -h

      - name: Sync locked source and toolchain revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 r61-build-route/sync_with_retry.py \
            --package "$PACKAGE_DIR" --workspace "$WORKSPACE_DIR" --jobs 4

      - name: Apply unchanged R18 preparation hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 r55-source/ci/prepare_legacy.py

      - name: Build ADC/gauge candidates before the isolated inactive 47-module MCA closure
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DEBUG
          python3 r84-build-route/build_fastcharge.py \
            --workspace "$WORKSPACE_DIR" --package "$PACKAGE_DIR" \
            --baseline "$GITHUB_WORKSPACE/myron-adaptation-r12" \
            --r18 "$GITHUB_WORKSPACE/myron-boot-r18" \
            --repo-root "$GITHUB_WORKSPACE" --jobs "$BUILD_JOBS"

      - name: Upload R84 source and diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r84-fastcharge-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORKSPACE_DIR }}/integration-reports/r84-*.json
            ${{ env.WORKSPACE_DIR }}/integration-reports/r84-*.log
            ${{ env.WORKSPACE_DIR }}/integration-reports/r84-*.txt
            ${{ env.WORKSPACE_DIR }}/integration-reports/r84-host/**/*.json
            ${{ env.WORKSPACE_DIR }}/integration-reports/r84-host/**/*.log
            ${{ env.WORKSPACE_DIR }}/integration-reports/r84-host/**/*.txt
            ${{ env.WORKSPACE_DIR }}/integration-reports/sync.json
            ${{ env.WORKSPACE_DIR }}/integration-reports/sync-retries/**/summary.json
            ${{ env.PACKAGE_DIR }}/sources.lock.json
            ${{ github.workspace }}/r84-host-reports/
            ${{ github.workspace }}/r84-build-route/
            ${{ github.workspace }}/.github/workflows/build-myron-fastcharge-r84.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified ADC and gauge compile candidates
        if: ${{ !cancelled() && hashFiles('kernel_workspace/myron-platform-r1/integration-artifacts/r84-fastcharge-candidates/candidate-complete.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r84-fastcharge-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORKSPACE_DIR }}/integration-artifacts/r84-fastcharge-candidates/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Upload inactive full MCA compile proof
        if: ${{ !cancelled() && hashFiles('kernel_workspace/myron-platform-r1/integration-artifacts/r84-mca-validation-only/validation-complete.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r84-mca-validation-only-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORKSPACE_DIR }}/integration-artifacts/r84-mca-validation-only/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
