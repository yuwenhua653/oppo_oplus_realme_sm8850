name: Myron native kernel integration test

on:
  push:
    branches: [myron/device-native-kbuild]
    paths:
      - '.github/workflows/native-kbuild.yml'
      - 'kernel/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myron-native-kbuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      KBUILD_BUILD_USER: myron-ci
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_TIMESTAMP: 'Thu Nov 5 00:00:00 UTC 2026'
    steps:
      - name: Checkout native device integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: device/xiaomi/myron
          persist-credentials: false
      - name: Checkout pinned kernel source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4f5a0cf774c7a109e8e4fa1269aeec91169ed267
          path: kernel/xiaomi/sm8850
          persist-credentials: false
      - name: Checkout pinned external modules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4cf53542c7a90c5b285ec228c351ecbfa8e7218a
          path: kernel/xiaomi/sm8850-modules
          persist-credentials: false
      - name: Checkout pinned device trees
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b84c303a85a8f8b73d7fa3d4df37b57a601dd5b1
          path: kernel/xiaomi/sm8850-devicetrees
          persist-credentials: false
      - name: Checkout stock Evolution build rules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Evolution-X/vendor_evolution
          ref: cda547177491b2921aed502ad1fafe28d511ef22
          path: vendor/lineage
          persist-credentials: false
      - name: Checkout DT tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LineageOS/android_external_dtc
          ref: c1197f56b8f468effbbf5e79feae353c4280e2ea
          path: host-dtc
          persist-credentials: false
      - name: Checkout mkdtboimg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LineageOS/android_system_libufdt
          ref: 70c20864187df19f3e7d358ca8436f77d61a3f39
          path: host-libufdt
          persist-credentials: false
      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libdw-dev \
            zlib1g-dev pkg-config cmake kmod ccache rsync python3 device-tree-compiler erofs-utils lz4 zstd
          mkdir -p out/host/bin out/logs
          df -h .
          free -h
      - name: Build pinned pahole with dynamic per-CPU variable storage
        run: |
          set -euo pipefail
          # Ubuntu 24.04 pahole 1.25 truncates this kernel's >4096 per-CPU vars.
          # Keep BTF enabled; use upstream 1.28 including distilled module BTF.
          git init host-pahole
          git -C host-pahole fetch --depth=1 \
            https://kernel.googlesource.com/pub/scm/devel/pahole/pahole \
            1cb4202ed2cbd591734f6b7fb1d2b8aa8eb5a1c3
          git -C host-pahole checkout --detach FETCH_HEAD
          git -C host-pahole submodule update --init --recursive --depth=1
          test "$(git -C host-pahole rev-parse HEAD)" = 1cb4202ed2cbd591734f6b7fb1d2b8aa8eb5a1c3
          test "$(git -C host-pahole/lib/bpf rev-parse HEAD)" = 09b9e83102eb8ab9e540d36b4559c55f3bcdb95d
          cmake -S host-pahole -B out/host/pahole-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGIT_SUBMODULE=OFF
          cmake --build out/host/pahole-build --target pahole -j"$(nproc)"
          cp out/host/pahole-build/pahole out/host/bin/pahole
          test "$(out/host/bin/pahole --version)" = v1.28
          out/host/bin/pahole --version | tee out/logs/pahole.txt
          sha256sum out/host/bin/pahole > out/logs/pahole.sha256
      - name: Cache pinned Android Clang
        id: clang-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: toolchains/clang
          key: myron-native-clang-r536225-2d4dcbff7cb42f360f368bacf51cfe711fd1cb0f
      - name: Download Android Clang r536225
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p toolchains/clang
          curl --fail --location --retry 3 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/2d4dcbff7cb42f360f368bacf51cfe711fd1cb0f/clang-r536225.tar.gz' \
            -o "$RUNNER_TEMP/myron-clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/myron-clang.tar.gz" -C toolchains/clang
          rm "$RUNNER_TEMP/myron-clang.tar.gz"
      - name: Verify downloaded toolchain
        run: |
          set -euo pipefail
          toolchains/clang/bin/clang --version | tee out/logs/compiler.txt
      - name: Save verified toolchain before the build
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: toolchains/clang
          key: myron-native-clang-r536225-2d4dcbff7cb42f360f368bacf51cfe711fd1cb0f
      - name: Cache compiler objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ccache
          key: myron-native-ccache-r536225-${{ github.run_id }}
          restore-keys: myron-native-ccache-r536225-
      - name: Compile and link native kernel host dependency probe
        run: |
          set -euo pipefail
          cat > out/logs/host-deps.c <<'EOF'
          #include <dwarf.h>
          #include <elfutils/libdw.h>
          #include <elfutils/libdwfl.h>
          #include <gelf.h>
          #include <zlib.h>
          #include <openssl/crypto.h>
          int main(void) {
              Dwarf *dw = dwarf_begin(-1, DWARF_C_READ);
              if (dw) dwarf_end(dw);
              return elf_version(EV_CURRENT) == EV_NONE ||
                     zlibVersion() == NULL || OpenSSL_version_num() == 0;
          }
          EOF
          pkg-config --modversion libdw libelf zlib openssl | tee out/logs/host-deps-versions.txt
          toolchains/clang/bin/clang out/logs/host-deps.c -o out/host/bin/host-deps \
            $(pkg-config --cflags --libs libdw libelf zlib openssl)
          out/host/bin/host-deps
      - name: Check BTF encoding beyond the old per-CPU limit
        run: |
          set -euo pipefail
          python3 device/xiaomi/myron/kernel/ci/check_btf.py \
            --kernel kernel/xiaomi/sm8850 --pahole out/host/bin/pahole \
            --cc toolchains/clang/bin/clang --objcopy toolchains/clang/bin/llvm-objcopy \
            --out out/logs/btf-preflight | tee out/logs/btf-preflight.log
      - name: Prepare host DT tools and check configuration
        env:
          MYRON_TEST_FDTOVERLAYMERGE: ${{ github.workspace }}/out/host/bin/fdtoverlaymerge
          MYRON_TEST_MKDTBOIMG: ${{ github.workspace }}/out/host/bin/mkdtboimg
        run: |
          set -euo pipefail
          toolchains/clang/bin/clang --version | tee out/logs/compiler.txt
          out/host/bin/pahole --version | tee out/logs/pahole.txt
          git -C vendor/lineage rev-parse HEAD > out/logs/evolution-build-commit.txt
          test "$(git -C vendor/lineage hash-object build/tasks/kernel.mk)" = 343e4361f35ed01827663c67225d5129c13fbcec
          # This pinned Android libfdt has three signed/unsigned size comparisons.
          # Retain the warnings; relax only their promotion to errors for host DTC.
          # Bundle the pinned libfdt into the tools instead of loading a distro copy.
          make -C host-dtc -j"$(nproc)" STATIC_BUILD=1 EXTRA_CFLAGS=-Wno-error=sign-compare dtc fdtput fdtoverlay
          cc -O2 -I host-dtc -I host-dtc/libfdt host-dtc/fdtoverlaymerge.c \
            host-dtc/util.c host-dtc/libfdt/*.c -o out/host/bin/fdtoverlaymerge
          cp host-dtc/dtc host-dtc/fdtput host-dtc/fdtoverlay out/host/bin/
          cp host-libufdt/utils/src/mkdtboimg.py out/host/bin/mkdtboimg
          chmod +x out/host/bin/mkdtboimg
          export PATH="$GITHUB_WORKSPACE/out/host/bin:$PATH"
          python3 -B -m unittest discover -s device/xiaomi/myron/kernel -p 'test_*.py' -v \
            2>&1 | tee out/logs/device-tests.log
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('device/xiaomi/myron/kernel/BoardConfigKernel.mk').read_text()
          module_list = pathlib.Path('kernel/xiaomi/sm8850-modules/android/myron-native/external-modules.list').read_text().split()
          actual = re.search(r'TARGET_KERNEL_EXT_MODULES := (.*?)(?=\n\n)', root, re.S).group(1).replace('\\', '').split()
          assert actual == module_list, 'Device external module order differs from source list'
          assert 'TARGET_NO_KERNEL_OVERRIDE' not in root
          assert 'preexported_kernel_headers' not in root
          PY
      - name: Validate each expanded stock build recipe
        run: |
          set -euo pipefail
          python3 device/xiaomi/myron/kernel/ci/check_recipes.py \
            --out out/logs/recipe-preflight | tee out/logs/recipe-preflight.log
      - name: Build through stock Evolution kernel.mk with read-only sources
        id: native-build
        run: |
          set -euo pipefail
          for path in kernel/xiaomi/sm8850 kernel/xiaomi/sm8850-modules kernel/xiaomi/sm8850-devicetrees; do
            sudo mount --bind "$path" "$path"
            sudo mount -o remount,bind,ro "$path"
          done
          make -f device/xiaomi/myron/kernel/ci/standalone.mk -j1 ci-all \
            2>&1 | tee out/logs/native-kbuild.log
      - name: Preserve compiler cache after a build attempt
        if: always() && (steps.native-build.outcome == 'success' || steps.native-build.outcome == 'failure')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ccache
          key: myron-native-ccache-r536225-${{ github.run_id }}
      - name: Check EROFS payload estimate and validate all outputs
        run: |
          set -euo pipefail
          mkfs.erofs -zlz4hc,9 out/vendor_dlkm.payload.erofs out/target/product/myron/vendor_dlkm \
            2>&1 | tee out/logs/erofs.log
          python3 device/xiaomi/myron/kernel/ci/verify.py
          ccache --show-stats | tee out/logs/ccache.txt
      - name: Upload native build outputs (not a flash package)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-native-kbuild-test-${{ github.run_id }}
          path: |
            out/target/product/myron/kernel
            out/target/product/myron/dtb.img
            out/target/product/myron/dtbo.img
            out/target/product/myron/system_dlkm
            out/target/product/myron/vendor_dlkm
            out/target/product/myron/vendor_ramdisk
            out/target/product/myron/recovery/root
            out/native-ci-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-native-kbuild-diagnostics-${{ github.run_id }}
          path: |
            out/logs
            out/native-ci-report.json
            out/target/product/myron/obj/KERNEL_OBJ/.config
            out/target/product/myron/obj/KERNEL_OBJ/Module.symvers
            out/target/product/myron/obj/DTB_OBJ/myron-images/*.json
          include-hidden-files: true
          retention-days: 7
