name: Myron R82 CNSS board firmware selection candidate

on:
  push:
    branches:
      - codex/myron-r61-battery
    paths:
      - .github/workflows/build-myron-cnss-r82.yml
      - r82-build-route/**
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs
        type: choice
        required: true
        default: '2'
        options: ['2', '4']

permissions:
  contents: read

concurrency:
  group: myron-r82-cnss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_NODEBUG: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      WORKSPACE_DIR: ${{ github.workspace }}/kernel_workspace/myron-platform-r1
      PACKAGE_DIR: ${{ github.workspace }}/myron-qcom-platform-r1
      BUILD_JOBS: ${{ inputs.jobs || '2' }}
    steps:
      - name: Checkout integration files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify frozen CNSS experiment inputs before sync
        shell: bash
        run: |
          set -euo pipefail
          echo '77309ae1e135e8e16b97b96c3671f860a6cc1d76c4cb7313bc05709594d60665  r82-build-route/cnss-contract.json' | sha256sum --check --strict
          python3 r82-build-route/build_cnss.py --repo-root "$GITHUB_WORKSPACE" --check-inputs
          mkdir -p "$GITHUB_WORKSPACE/r82-host-reports"
          python3 r82-build-route/test_cnss.py > "$GITHUB_WORKSPACE/r82-host-reports/source-test.log" 2>&1

      - name: Extract unchanged pinned source preparation bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 r55-source/ci/extract_inputs.py --root "$GITHUB_WORKSPACE"
          python3 "$GITHUB_WORKSPACE/myron-adaptation-r12/fastcheck_r12.py" \
            --reports "$GITHUB_WORKSPACE/myron-fastchecks"

      - name: Prepare hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential bc bison flex libssl-dev libelf-dev libncurses-dev zstd lz4 rsync zip unzip cpio pkg-config patch
          df -h .
          free -h

      - name: Sync locked source and toolchain revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 r61-build-route/sync_with_retry.py \
            --package "$PACKAGE_DIR" --workspace "$WORKSPACE_DIR" --jobs 4

      - name: Apply unchanged R18 preparation hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 r55-source/ci/prepare_legacy.py

      - name: Build only CNSS candidate and mandatory prerequisites
        shell: bash
        run: |
          set -euo pipefail
          unset CCACHE_DEBUG
          python3 r82-build-route/build_cnss.py \
            --workspace "$WORKSPACE_DIR" --package "$PACKAGE_DIR" \
            --baseline "$GITHUB_WORKSPACE/myron-adaptation-r12" \
            --r18 "$GITHUB_WORKSPACE/myron-boot-r18" \
            --repo-root "$GITHUB_WORKSPACE" --jobs "$BUILD_JOBS"

      - name: Upload CNSS source and diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r82-cnss-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORKSPACE_DIR }}/integration-reports/r82-*.json
            ${{ env.WORKSPACE_DIR }}/integration-reports/r82-*.log
            ${{ env.WORKSPACE_DIR }}/integration-reports/r82-*.txt
            ${{ env.WORKSPACE_DIR }}/integration-reports/sync.json
            ${{ env.WORKSPACE_DIR }}/integration-reports/sync-retries/**/summary.json
            ${{ env.PACKAGE_DIR }}/sources.lock.json
            ${{ github.workspace }}/r82-host-reports/
            ${{ github.workspace }}/r82-build-route/
            ${{ github.workspace }}/.github/workflows/build-myron-cnss-r82.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified CNSS compile output
        if: ${{ !cancelled() && hashFiles('kernel_workspace/myron-platform-r1/integration-artifacts/r82-cnss-candidate/candidate-complete.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-r82-cnss-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WORKSPACE_DIR }}/integration-artifacts/r82-cnss-candidate/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
