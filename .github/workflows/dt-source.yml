name: Myron DT source compile and assembly

on:
  push:
    branches: [myron/device-cnb-source]
    paths:
      - 'kernel/**'
      - '.github/workflows/dt-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myron-dt-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dt-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read pinned kernel entry
        id: entry
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('commit=' + json.load(open('kernel/modules.json'))['entry_commit'], file=output)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuwenhua653/oppo_oplus_realme_sm8850
          ref: ${{ steps.entry.outputs.commit }}
          path: entry
          persist-credentials: false
      - name: Prepare DT host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential device-tree-compiler
          git init host-dtc
          git -C host-dtc remote add origin https://github.com/LineageOS/android_external_dtc.git
          git -C host-dtc fetch --depth=1 origin c1197f56b8f468effbbf5e79feae353c4280e2ea
          git -C host-dtc checkout --detach FETCH_HEAD
          printf '%s\n' '#define DTC_VERSION "DTC c1197f56b8f4"' > host-dtc/version_gen.h
          cc -O2 -I host-dtc -I host-dtc/libfdt host-dtc/fdtoverlaymerge.c host-dtc/util.c host-dtc/libfdt/*.c -o host-dtc/fdtoverlaymerge
          git init host-libufdt
          git -C host-libufdt remote add origin https://github.com/LineageOS/android_system_libufdt.git
          git -C host-libufdt fetch --depth=1 origin 70c20864187df19f3e7d358ca8436f77d61a3f39
          git -C host-libufdt checkout --detach FETCH_HEAD
      - name: Test assembly gates
        env:
          MYRON_TEST_FDTOVERLAYMERGE: ${{ github.workspace }}/host-dtc/fdtoverlaymerge
          MYRON_TEST_MKDTBOIMG: ${{ github.workspace }}/host-libufdt/utils/src/mkdtboimg.py
        run: python3 -B kernel/test_source_dt.py
      - name: Compile only the 32 DT inputs from pinned sources
        run: python3 -B kernel/compile_dt.py --entry entry --workspace dt-workspace --output dt-compiled --sync
      - name: Assemble all eight variants with strict hardware checks
        run: |
          python3 -B kernel/source_dt.py --compiled dt-compiled --output dt-images \
            --fdtoverlaymerge "$GITHUB_WORKSPACE/host-dtc/fdtoverlaymerge" \
            --mkdtboimg "$GITHUB_WORKSPACE/host-libufdt/utils/src/mkdtboimg.py"
          python3 - <<'PYREPORT'
          import json, os
          report = json.load(open('dt-images/source-dt-report.json'))
          assert report['success'] and report['base_count'] == 8
          assert len(report['variants']) == 8 and not report['errors']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              print('32 source DT inputs compiled; all 8 variants passed structural checks.', file=output)
              print('Reviewed foundry-zero matches: ' + str(len(report['reviewed_matches'])), file=output)
              print('Raw DT images emitted. This is not a flash package or a full kernel/ROM build.', file=output)
              print('Hardware validation is still required; default ROM DT mode remains OEM.', file=output)
          PYREPORT
      - name: Upload complete raw DT images (not a flash package)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-source-dt-raw-${{ github.run_id }}
          path: |
            dt-images/dtb.img
            dt-images/dtbo.img
            dt-images/source-dt-report.json
            dt-compiled/dt-compile.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload DT diagnostics (not a flash package)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-dt-diagnostics-${{ github.run_id }}
          path: |
            dt-compiled/*.dtb
            dt-compiled/*.dtbo
            dt-compiled/*.log
            dt-compiled/dt-compile.json
            dt-images/source-dt-report.json
          retention-days: 14
